# Candidate Atlas staging policy. Not admitted by the installed local-Mongo
# deploy wrapper; do not install until Atlas backups and rollback are ready.
name: shadowops-identity-staging
services:
  identity:
    image: ghcr.io/evilsysadmin/shadowops-identity@${IDENTITY_IMAGE_DIGEST:?Require an admitted immutable Identity image digest}
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    volumes:
      - /etc/shadowops/identity-staging/atlas-service.json:/run/secrets/identity-staging.json:ro
    networks:
      atlas-egress: {}
      origin:
        aliases: [id-staging.shadowops.dpdns.org]
  identity-tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    platform: linux/arm64
    user: "65532:65532"
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    env_file: [/etc/shadowops/identity-staging/tunnel.env]
    volumes:
      - /etc/shadowops/identity-staging/ca.pem:/run/identity/ca.pem:ro
    networks: [origin, tunnel-egress]
    depends_on:
      identity:
        condition: service_healthy
networks:
  origin:
    name: shadowops-identity-staging-origin
    internal: true
  tunnel-egress:
    name: shadowops-identity-staging-tunnel-egress
  atlas-egress:
    name: shadowops-identity-staging-atlas-egress
