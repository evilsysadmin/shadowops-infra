# Dedicated, staging-only Chronicles web probe. Not the playable game.
# Independent Compose project: must never be stacked with compose.yaml.
name: shadowops-chronicles-web-staging
services:
  chronicles-web:
    image: ghcr.io/evilsysadmin/chronicles-web@${CHRONICLES_WEB_IMAGE_DIGEST:?Set an independently verified sha256 web manifest digest}
    platform: linux/arm64
    user: "101:101"
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
