name: Identity production Mongo encrypted backup contract (offline)
on:
  pull_request:
    paths:
      - Makefile
      - scripts/identity_production_mongo_backup.py
      - tests/test_identity_production_mongo_backup.py
      - docs/identity-production-mongo-backup.md
      - host/identity-production-mongo-backup.service
      - host/identity-production-mongo-backup.timer
      - .github/workflows/identity-production-mongo-backup.yml
  push:
    branches: [main]
    paths:
      - Makefile
      - scripts/identity_production_mongo_backup.py
      - tests/test_identity_production_mongo_backup.py
      - docs/identity-production-mongo-backup.md
      - host/identity-production-mongo-backup.service
      - host/identity-production-mongo-backup.timer
      - .github/workflows/identity-production-mongo-backup.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Backup contract negatives without OCI, Mongo, cloud, credentials or root
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python3 -m unittest discover -s tests -p test_identity_production_mongo_backup.py -v
          python3 -m py_compile scripts/identity_production_mongo_backup.py
          make identity-prod-mongo-backup-plan
          make --dry-run identity-prod-mongo-backup-inspect
          if python3 scripts/identity_production_mongo_backup.py backup; then
            echo 'CI unexpectedly executed an operator backup' >&2
            exit 1
          fi
      - name: Verify disabled-by-default systemd service syntax (no install)
        run: |
          set -euo pipefail
          systemd-analyze verify host/identity-production-mongo-backup.service host/identity-production-mongo-backup.timer
