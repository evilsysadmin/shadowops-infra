name: ShadowOps · Chronicles staging Pages release
on:
  pull_request:
    paths:
      - '.github/workflows/chronicles-pages-release.yml'
      - 'docs/chronicles-staging-release-request.md'
      - 'scripts/chronicles_pages.py'
      - 'scripts/pages_owner_admission.py'
      - 'scripts/chronicles_source_ci.py'
      - 'scripts/chronicles_production_admission.py'
      - 'tests/test_chronicles_source_ci.py'
      - 'tests/test_chronicles_production_admission.py'
      - 'tests/test_pages_owner_admission.py'
      - 'tests/test_chronicles_pages_target.py'
      - 'tests/test_chronicles_pages_verify.py'
      - 'tests/test_chronicles_react_pages.py'
      - 'tests/test_chronicles_public_browser_workflow.py'
      - 'scripts/chronicles_api_before_pages.py'
      - 'scripts/chronicles_pages_verified_receipt.py'
      - 'tests/test_chronicles_pages_verified_receipt.py'
      - 'tests/test_chronicles_api_before_pages.py'
      - 'docs/chronicles-pages-handoff.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronicles-pages-release.yml'
      - 'docs/chronicles-staging-release-request.md'
      - 'scripts/chronicles_pages.py'
      - 'scripts/pages_owner_admission.py'
      - 'scripts/chronicles_source_ci.py'
      - 'scripts/chronicles_production_admission.py'
      - 'tests/test_chronicles_source_ci.py'
      - 'tests/test_chronicles_production_admission.py'
      - 'tests/test_pages_owner_admission.py'
      - 'tests/test_chronicles_pages_target.py'
      - 'tests/test_chronicles_pages_verify.py'
      - 'tests/test_chronicles_react_pages.py'
      - 'tests/test_chronicles_public_browser_workflow.py'
      - 'scripts/chronicles_api_before_pages.py'
      - 'scripts/chronicles_pages_verified_receipt.py'
      - 'tests/test_chronicles_pages_verified_receipt.py'
      - 'tests/test_chronicles_api_before_pages.py'
      - 'docs/chronicles-pages-handoff.md'
  schedule:
    # Cross-repo main updates do not emit workflow_run events here.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: staging = current Chronicles main; production = promote an exact SHA already on main
        type: choice
        options: [staging, production]
        default: staging
      source_sha:
        description: Chronicles main SHA to promote (production only; the one validated on staging)
        type: string
        required: false
      only_if_new:
        description: Internal source-CI dispatch; keep manual force/redeploy behavior when false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: shadowops-cloudflare-chronicles-pages-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  contracts:
    name: Static Pages ownership and DNS boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_pages_owner_admission.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_source_ci.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_production_admission.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_pages_target.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_pages_verify.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_react_pages.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_public_browser_workflow.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_api_before_pages.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_pages_verified_receipt.py' -v
      - run: python3 scripts/chronicles_pages.py self-test

  staging-candidate:
    name: Skip a previously verified Chronicles Pages SHA
    needs: contracts
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.environment != 'production')) &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_SHA: ${{ inputs.source_sha }}
      ONLY_IF_NEW: ${{ inputs.only_if_new || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare current source main against verified Pages receipts
        id: check
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/evilsysadmin/chronicles-of-matthias/commits/main --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 64
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          # An automatic source dispatch is never allowed to deploy a newer
          # revision accidentally, or re-publish an already verified SHA.
          if [[ "$ONLY_IF_NEW" == 'true' && "$REQUESTED_SHA" != "$sha" ]]; then
            echo "CHRONICLES_PAGES_DISPATCH_SUPERSEDED requested=$REQUESTED_SHA"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: all three exact-SHA source workflows must finish green.
          verdict="$(python3 scripts/chronicles_source_ci.py "$sha")"
          if [[ "$verdict" != 'ready' ]]; then
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
              echo 'Chronicles source CI is not fully green' >&2
              exit 1
            fi
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' || "$ONLY_IF_NEW" == 'true' ]]; then
            # A historical artifact alone is not proof that staging still
            # serves this SHA. Require a successful trusted run and live HTTPS.
            if python3 scripts/chronicles_pages_verified_receipt.py "$sha"; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            else
              receipt_status=$?
              if (( receipt_status != 1 )); then
                echo "CHRONICLES_PAGES_RECEIPT_CHECK_INCONCLUSIVE" >&2
                exit "$receipt_status"
              fi
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  api-ready:
    name: Wait for exact API; skip obsolete client SHAs
    needs: [contracts, staging-candidate]
    if: needs.staging-candidate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful same-SHA OCI smoke or skip superseded client
        id: gate
        env:
          ADMITTED_SHA: ${{ needs.staging-candidate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/chronicles_api_before_pages.py "$ADMITTED_SHA"; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(gh api repos/evilsysadmin/chronicles-of-matthias/commits/main --jq .sha)"
          if [[ "$current" != "$ADMITTED_SHA" ]]; then
            echo "CHRONICLES_PAGES_SUPERSEDED_BEFORE_RELEASE sha=$ADMITTED_SHA"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'API gate failed for current SHA; no Pages mutation' >&2
          exit 1

  release:
    name: Publish Chronicles staging from protected source main
    needs: [contracts, staging-candidate, api-ready]
    if: needs.api-ready.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.chronicles.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact source repository (never run its deployment workflows)
        uses: actions/checkout@v4
        with:
          repository: evilsysadmin/chronicles-of-matthias
          ref: ${{ needs.staging-candidate.outputs.source_sha }}
          path: chronicles-source
          persist-credentials: false
      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C chronicles-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require protected mains and single Pages owner before any mutations
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/pages_owner_admission.py
      - name: Prepare pinned Node.js for the Chronicles frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the game against its own API
        working-directory: chronicles-source/frontend
        env:
          # Iteración 2: API propia de Chronicles (cuentas y partidas propias).
          VITE_API_URL: https://chronicles-api-staging.shadowops.dpdns.org/api
          VITE_BUILD_SHA: ${{ steps.source.outputs.sha }}
          CHRONICLES_DEPLOY_BASE: /
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          # The in-app update banner must read the exact release being deployed.
          test -s dist/release.json
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('dist/release.json','utf8'));if(m.build!==process.env.VITE_BUILD_SHA) process.exit(1)"
          grep -q 'Chronicles of Matthias' dist/index.html
          grep -q '/assets/' dist/index.html
          # The real game, not a shell: original component, Tactics, the
          # Three.js renderer and server-side runs must be in the bundle.
          ls dist/assets/ChroniclesOfMatthias-*.js
          ls dist/assets/ChroniclesOfMatthiasTactics-*.js
          ls dist/assets/chroniclesOfMatthiasThree-*.js
          # Runtime assets served from public/ (not the SPA fallback).
          test -s dist/audio/orchestra/violin-fs3.mp3
          test -s dist/models/matthias-home-canonical.glb
          grep -lFq '/chronicles/runs' dist/assets/*.js
          grep -lFq 'chronicles-api-staging.shadowops.dpdns.org' dist/assets/*.js
      - name: Assemble static root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chronicles-pages"
          mkdir -p "$root"
          cp -a chronicles-source/frontend/dist/. "$root/"
          grep -q 'Chronicles of Matthias' "$root/index.html"
      - name: Require Cloudflare credentials in Infra, not the game repository
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
      - name: Reject foreign hostname ownership before any mutations
        run: python3 scripts/chronicles_pages.py preflight
      - name: Reject superseded source before Pages mutations
        shell: bash
        env:
          ADMITTED_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api repos/evilsysadmin/chronicles-of-matthias/commits/main --jq .sha)"
          if [[ "$current" != "$ADMITTED_SHA" ]]; then
            echo "CHRONICLES_PAGES_SUPERSEDED_BEFORE_PUBLISH sha=$ADMITTED_SHA current=$current"
            exit 1
          fi
      - name: Reconcile independent Chronicles Pages project
        run: python3 scripts/chronicles_pages.py project
      - name: Publish exact source SHA to the isolated Pages project
        shell: bash
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # Recheck immediately before the irreversible publish operation.
          # The earlier gate also protects project reconciliation, but a build
          # can become obsolete while Cloudflare setup runs.
          current="$(gh api repos/evilsysadmin/chronicles-of-matthias/commits/main --jq .sha)"
          if [[ "$current" != "$CHRONICLES_SOURCE_SHA" ]]; then
            echo "CHRONICLES_PAGES_SUPERSEDED_AT_DEPLOY sha=$CHRONICLES_SOURCE_SHA current=$current"
            exit 1
          fi
          npx --yes wrangler@4.127.1 pages deploy "$RUNNER_TEMP/chronicles-pages" \
            --project-name chronicles-staging \
            --branch main \
            --commit-hash "$CHRONICLES_SOURCE_SHA" \
            --commit-dirty=false
      - name: Reconcile the exact domain without overwriting other DNS
        run: python3 scripts/chronicles_pages.py domain
      - name: Prove the public game build at root
        run: python3 scripts/chronicles_pages.py verify
      - name: Prove the public update manifest serves the exact SHA
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "https://staging.chronicles.shadowops.dpdns.org/release.json?ts=${GITHUB_RUN_ID}" \
            -o "$RUNNER_TEMP/chronicles-published-release.json"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "chronicles-published-release.json"
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              valid = isinstance(data, dict) and data.get("build") == os.environ["EXPECTED_SHA"]
          except (ValueError, UnicodeError):
              valid = False
          if not valid:
              raise SystemExit("CHRONICLES_PUBLIC_RELEASE_MANIFEST_MISMATCH")
          print("CHRONICLES_PUBLIC_RELEASE_MANIFEST_OK")
          PY
      - name: Real public browser smoke (desktop, mobile, login, update deferral)
        working-directory: chronicles-source/frontend
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CHRONICLES_STAGING_INVITE_CODE: ${{ secrets.CHRONICLES_STAGING_INVITE_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node smoke/public-staging.mjs
          # End-to-end first-hour flow with a real Chronicles API user and
          # completely fresh desktop/mobile browser contexts.
          node smoke/public-staging-journey.mjs
      - name: Preserve public-browser screenshots as deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-public-browser-${{ needs.staging-candidate.outputs.source_sha }}
          path: |
            chronicles-source/frontend/chronicles-public-*.png
            chronicles-source/frontend/chronicles-journey-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject superseded source before writing verified receipt
        shell: bash
        env:
          ADMITTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          current="$(gh api repos/evilsysadmin/chronicles-of-matthias/commits/main --jq .sha)"
          if [[ "$current" != "$ADMITTED_SHA" ]]; then
            echo "CHRONICLES_PAGES_SUPERSEDED_AFTER_SMOKE sha=$ADMITTED_SHA current=$current"
            exit 1
          fi
      - name: Record the verified Chronicles Pages source generation
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p verified-pages
          printf '%s\n' "$SOURCE_SHA" > verified-pages/source-sha.txt
          # This evidence is created only after HTTPS manifest and public browser
          # checks succeed; a dispatched or skipped release cannot produce it.
          python3 - <<'PY'
          import json, os, pathlib
          sha = os.environ["SOURCE_SHA"]
          manifest = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "chronicles-published-release.json").read_text())
          if manifest.get("build") != sha:
              raise SystemExit("CHRONICLES_PAGES_RECEIPT_SHA_MISMATCH")
          evidence = {
              "schema": 1,
              "source_sha": sha,
              "published_manifest": manifest,
              "public_origin": "https://staging.chronicles.shadowops.dpdns.org",
              "api_receipt": "chronicles-api-staging-" + sha,
              "api_gate": "chronicles_api_before_pages.py",
              "api_verified_before_pages": True,
              "manifest_verified": True,
              "public_browser_smoke_passed": True,
              "workflow_run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("verified-pages/evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
      - name: Save verified Pages receipt for idempotent hourly sync
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-pages-staging-${{ steps.source.outputs.sha }}
          path: verified-pages/
          retention-days: 90

  production:
    name: Promote a Chronicles main SHA to production
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://chronicles.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHRONICLES_PAGES_ENV: production
      CHRONICLES_RELEASE_MODE: promote
      PROMOTE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require an exact SHA to promote
        shell: bash
        run: '[[ "$PROMOTE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "CHRONICLES_PAGES_BLOCKED production needs source_sha" >&2; exit 64; }'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact source repository (never run its deployment workflows)
        uses: actions/checkout@v4
        with:
          repository: evilsysadmin/chronicles-of-matthias
          ref: ${{ inputs.source_sha }}
          path: chronicles-source
          persist-credentials: false
      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C chronicles-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require staging evidence and matching production API before Pages
        env:
          ADMITTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/chronicles_production_admission.py "$ADMITTED_SHA"
          python3 scripts/chronicles_production_admission.py --production-api "$ADMITTED_SHA"
          for path in health ready; do
            curl -fsS --max-time 15 "https://chronicles-api.shadowops.dpdns.org/api/$path" >/dev/null
          done
      - name: Require protected mains and single Pages owner before any mutations
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/pages_owner_admission.py
      - name: Prepare pinned Node.js for the Chronicles frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the game against its own API
        working-directory: chronicles-source/frontend
        env:
          VITE_API_URL: https://chronicles-api.shadowops.dpdns.org/api
          VITE_BUILD_SHA: ${{ steps.source.outputs.sha }}
          CHRONICLES_DEPLOY_BASE: /
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          # The in-app update banner must read the exact release being deployed.
          test -s dist/release.json
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('dist/release.json','utf8'));if(m.build!==process.env.VITE_BUILD_SHA) process.exit(1)"
          grep -q 'Chronicles of Matthias' dist/index.html
          grep -q '/assets/' dist/index.html
          # The real game, not a shell: original component, Tactics, the
          # Three.js renderer and server-side runs must be in the bundle.
          ls dist/assets/ChroniclesOfMatthias-*.js
          ls dist/assets/ChroniclesOfMatthiasTactics-*.js
          ls dist/assets/chroniclesOfMatthiasThree-*.js
          # Runtime assets served from public/ (not the SPA fallback).
          test -s dist/audio/orchestra/violin-fs3.mp3
          test -s dist/models/matthias-home-canonical.glb
          grep -lFq '/chronicles/runs' dist/assets/*.js
          grep -lFq 'chronicles-api.shadowops.dpdns.org/api' dist/assets/*.js
          if grep -lFq 'chronicles-api-staging.' dist/assets/*.js; then echo 'staging API in production build' >&2; exit 1; fi
      - name: Assemble static root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chronicles-pages"
          mkdir -p "$root"
          cp -a chronicles-source/frontend/dist/. "$root/"
          grep -q 'Chronicles of Matthias' "$root/index.html"
      - name: Require Cloudflare credentials in Infra, not the game repository
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
      - name: Reject foreign hostname ownership before any mutations
        run: python3 scripts/chronicles_pages.py preflight
      - name: Reconcile independent Chronicles Pages project
        run: python3 scripts/chronicles_pages.py project
      - name: Publish exact source SHA to the isolated Pages project
        shell: bash
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 pages deploy "$RUNNER_TEMP/chronicles-pages" \
            --project-name chronicles-production \
            --branch main \
            --commit-hash "$CHRONICLES_SOURCE_SHA" \
            --commit-dirty=false
      - name: Reconcile the exact domain without overwriting other DNS
        run: python3 scripts/chronicles_pages.py domain
      - name: Prove the public game build at root
        run: python3 scripts/chronicles_pages.py verify

      - name: Verify public production release manifest SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "https://chronicles.shadowops.dpdns.org/release.json?ts=$GITHUB_RUN_ID" \
            -o "$RUNNER_TEMP/chronicles-production-release.json"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "chronicles-production-release.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, dict) or data.get("build") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("CHRONICLES_PRODUCTION_MANIFEST_MISMATCH")
          print("CHRONICLES_PAGES_PRODUCTION_SHA_OK")
          PY
      - name: Record verified production Pages evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p verified-production-pages
          python3 - <<'PY'
          import json, os, pathlib
          sha = os.environ["SOURCE_SHA"]
          manifest = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "chronicles-production-release.json").read_text())
          assert manifest.get("build") == sha
          receipt = {"schema": 1, "environment": "production", "source_sha": sha,
                     "public_origin": "https://chronicles.shadowops.dpdns.org",
                     "release_manifest": manifest, "public_html_js_css_verified": True,
                     "api_receipt_verified": True,
                     "workflow_run": os.environ["GITHUB_SERVER_URL"] + "/" +
                                     os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" +
                                     os.environ["GITHUB_RUN_ID"]}
          pathlib.Path("verified-production-pages/evidence.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Save verified production Pages receipt
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-pages-production-${{ steps.source.outputs.sha }}
          path: verified-production-pages/evidence.json
