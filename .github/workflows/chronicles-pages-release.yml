name: ShadowOps · Chronicles staging Pages release
on:
  pull_request:
    paths:
      - '.github/workflows/chronicles-pages-release.yml'
      - 'scripts/chronicles_pages.py'
      - 'scripts/pages_owner_admission.py'
      - 'tests/test_pages_owner_admission.py'
      - 'tests/test_chronicles_pages_target.py'
      - 'tests/test_chronicles_pages_verify.py'
      - 'docs/chronicles-pages-handoff.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronicles-pages-release.yml'
      - 'scripts/chronicles_pages.py'
      - 'scripts/pages_owner_admission.py'
      - 'tests/test_pages_owner_admission.py'
      - 'tests/test_chronicles_pages_target.py'
      - 'tests/test_chronicles_pages_verify.py'
      - 'docs/chronicles-pages-handoff.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadowops-cloudflare-chronicles-pages-staging
  cancel-in-progress: false
jobs:
  contracts:
    name: Static Pages ownership and DNS boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_pages_owner_admission.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_pages_target.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_pages_verify.py' -v
      - run: python3 scripts/chronicles_pages.py self-test

  release:
    name: Publish Chronicles staging from protected source main
    needs: contracts
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.chronicles.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact source repository (never run its deployment workflows)
        uses: actions/checkout@v4
        with:
          repository: evilsysadmin/chronicles-of-matthias
          ref: main
          path: chronicles-source
          persist-credentials: false
      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C chronicles-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require protected mains and single Pages owner before any mutations
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/pages_owner_admission.py
      - name: Check source shell before publication
        working-directory: chronicles-source
        run: |
          node --test web/shell.test.mjs
          grep -q 'CHRONICLES OF MATTHIAS' web/index.html
          grep -q 'todavía no es el juego' web/index.html
      - name: Require Cloudflare credentials in Infra, not the game repository
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
      - name: Reject foreign hostname ownership before any mutations
        run: python3 scripts/chronicles_pages.py preflight
      - name: Reconcile independent Chronicles Pages project
        run: python3 scripts/chronicles_pages.py project
      - name: Publish exact source SHA to the isolated Pages project
        shell: bash
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 pages deploy chronicles-source/web \
            --project-name chronicles-staging \
            --branch main \
            --commit-hash "$CHRONICLES_SOURCE_SHA" \
            --commit-dirty=false
      - name: Reconcile the exact domain without overwriting other DNS
        run: python3 scripts/chronicles_pages.py domain
      - name: Prove live HTTPS and independent landing-page marker
        run: python3 scripts/chronicles_pages.py verify
