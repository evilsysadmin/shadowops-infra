name: ShadowOps · Chronicles staging Pages release
on:
  pull_request:
    paths:
      - '.github/workflows/chronicles-pages-release.yml'
      - 'scripts/chronicles_pages.py'
      - 'scripts/pages_owner_admission.py'
      - 'tests/test_pages_owner_admission.py'
      - 'tests/test_chronicles_pages_target.py'
      - 'tests/test_chronicles_pages_verify.py'
      - 'tests/test_chronicles_react_pages.py'
      - 'docs/chronicles-pages-handoff.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronicles-pages-release.yml'
      - 'scripts/chronicles_pages.py'
      - 'scripts/pages_owner_admission.py'
      - 'tests/test_pages_owner_admission.py'
      - 'tests/test_chronicles_pages_target.py'
      - 'tests/test_chronicles_pages_verify.py'
      - 'tests/test_chronicles_react_pages.py'
      - 'docs/chronicles-pages-handoff.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadowops-cloudflare-chronicles-pages-staging
  cancel-in-progress: false
jobs:
  contracts:
    name: Static Pages ownership and DNS boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_pages_owner_admission.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_pages_target.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_pages_verify.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_react_pages.py' -v
      - run: python3 scripts/chronicles_pages.py self-test

  release:
    name: Publish Chronicles staging from protected source main
    needs: contracts
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.chronicles.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact source repository (never run its deployment workflows)
        uses: actions/checkout@v4
        with:
          repository: evilsysadmin/chronicles-of-matthias
          ref: main
          path: chronicles-source
          persist-credentials: false
      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C chronicles-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require protected mains and single Pages owner before any mutations
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/pages_owner_admission.py
      - name: Check source shell before publication
        working-directory: chronicles-source
        run: |
          node --test web/shell.test.mjs
          node --test web/game/exploration-core.test.mjs
          grep -q 'CHRONICLES OF MATTHIAS' web/index.html
          grep -q 'todavía no es el juego' web/index.html
      - name: Prepare pinned Node.js for the original React frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original Chronicles React Home at / and keep /react/ compatibility
        working-directory: chronicles-source/frontend
        env:
          CHRONICLES_DEPLOY_BASE: /react/
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --test test/*.test.mjs
          npm run build
          grep -q '/react/assets/' dist/index.html
          # The original authored Three.js town must be in the compiled
          # application: merely displaying the old 2D preview is insufficient.
          grep -lFq 'swordhaven-sky-dome' dist/assets/*.js
          grep -lFq 'chronicles-swordhaven-town' dist/assets/*.js
          # The phone layout must ship in the protected React bundle, not
          # only as unmerged source / failed styling in a PR.
          grep -lFq 'react-town-playfield' dist/assets/*.js
          grep -lFq '.react-town-party-member' dist/assets/*.css
          # HUD from the original-world reference, not a standalone mock page:
          # real map, original Chronicle and portraits must be in the bundle.
          grep -lFq 'react-town-minimap' dist/assets/*.js
          grep -lFq 'react-town-journal' dist/assets/*.js
          grep -lFq '.react-town-hud' dist/assets/*.css
          grep -lFq '.react-town-minimap-cells' dist/assets/*.css
          # Source gate: mobile Play must request landscape with browser APIs
          # and installed standalone app must declare landscape.
          grep -lFq 'orientation-unsupported' dist/assets/*.js
          test -s dist/manifest.webmanifest
          grep -Fq '"orientation": "landscape"' dist/manifest.webmanifest
          grep -Fq '"display": "standalone"' dist/manifest.webmanifest
          test "$(find dist/assets -maxdepth 1 -name '*.webp' | wc -l)" -ge 4
          # Preserve the old preview at /react/ for browser/rollback comparison.
          mkdir -p "$RUNNER_TEMP/chronicles-react-preview"
          cp -a dist/. "$RUNNER_TEMP/chronicles-react-preview/"
          # The requested naked hostname serves the actual React expedition Home.
          CHRONICLES_DEPLOY_BASE=/ npm run build
          grep -q 'Chronicles of Matthias' dist/index.html
          grep -q '/assets/' dist/index.html
          grep -lFq 'chronicles-save-menu' dist/assets/*.js
          grep -lFq '.chronicles-save-menu--expedition' dist/assets/*.css
          grep -lFq '.react-town-menu-button' dist/assets/*.css
          # The original VGA materials/font have to reach the generated
          # React CSS, not merely exist as source assets.
          grep -lFq -- '--mm3-frame' dist/assets/*.css
          grep -lFq -- '--mm3-sapphire' dist/assets/*.css
          grep -lFq -- 'Chronicles Pixel' dist/assets/*.css
          test "$(find dist/assets -maxdepth 1 -name '*.woff2' | wc -l)" -ge 1
          # Original reducer initializes real PV/PH from 61 authored maps,
          # not the earlier 1KB party compatibility stub.
          grep -lFq 'data-chronicles-initial-mm3' dist/assets/*.js
          grep -lFq 'react-town-party-vitals' dist/assets/*.js
          grep -lFq '.react-town-party-vitals' dist/assets/*.css
          test -s chronicles-source/frontend/src/chronicles/maps/terra-c2.json
          test -s chronicles-source/frontend/src/chronicles/maps/terra-d4.json
          test -s chronicles-source/frontend/src/chronicles/maps/terra-e3.json
          test -s chronicles-source/frontend/src/chronicles/maps/terra-b3.json
          test -s chronicles-source/frontend/src/chronicles/maps/terra-c4.json
          test -s chronicles-source/frontend/src/chronicles/maps/terra-d2.json
          test -s dist/manifest.webmanifest
          test "$(find dist/assets -maxdepth 1 -name '*.webp' | wc -l)" -ge 4
      - name: Assemble isolated static root and nested React preview
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chronicles-pages"
          mkdir -p "$root/react" "$root/legacy-preview"
          cp -a chronicles-source/web/. "$root/legacy-preview/"
          # Keep old module URLs for explicit fallback smoke/older bookmarks.
          cp -a chronicles-source/web/game "$root/game"
          cp -a chronicles-source/frontend/dist/. "$root/"
          cp -a "$RUNNER_TEMP/chronicles-react-preview/." "$root/react/"
          grep -q 'Chronicles of Matthias' "$root/index.html"
          grep -q '/assets/' "$root/index.html"
          grep -q 'CHRONICLES OF MATTHIAS' "$root/legacy-preview/index.html"
          grep -q '/react/assets/' "$root/react/index.html"
          test -s "$root/game/crypt-map.js"
          test -s "$root/react/index.html"
          test -s "$root/manifest.webmanifest"
      - name: Require Cloudflare credentials in Infra, not the game repository
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
      - name: Reject foreign hostname ownership before any mutations
        run: python3 scripts/chronicles_pages.py preflight
      - name: Reconcile independent Chronicles Pages project
        run: python3 scripts/chronicles_pages.py project
      - name: Publish exact source SHA to the isolated Pages project
        shell: bash
        env:
          CHRONICLES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 pages deploy "$RUNNER_TEMP/chronicles-pages" \
            --project-name chronicles-staging \
            --branch main \
            --commit-hash "$CHRONICLES_SOURCE_SHA" \
            --commit-dirty=false
      - name: Reconcile the exact domain without overwriting other DNS
        run: python3 scripts/chronicles_pages.py domain
      - name: Prove public React Home at root, old explorer fallback and /react/ alias
        run: python3 scripts/chronicles_pages.py verify
