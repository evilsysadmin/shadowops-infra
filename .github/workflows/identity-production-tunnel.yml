name: ShadowOps Identity · production Cloudflare tunnel admission (offline)
on:
  pull_request:
    paths:
      - compose.identity.production-tunnel.yaml
      - scripts/identity_production_tunnel_preflight.py
      - tests/test_identity_production_tunnel.py
      - .github/workflows/identity-production-tunnel.yml
      - docs/identity-production-tunnel.md
  push:
    branches: [main]
    paths:
      - compose.identity.production-tunnel.yaml
      - scripts/identity_production_tunnel_preflight.py
      - tests/test_identity_production_tunnel.py
      - .github/workflows/identity-production-tunnel.yml
      - docs/identity-production-tunnel.md
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify strict routing, private inputs, origin CA and unsafe Compose rejection
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python3 -m unittest discover -s tests -p test_identity_production_tunnel.py -v
          python3 -m py_compile scripts/identity_production_tunnel_preflight.py
      - name: Render both profiles with synthetic paths, never start a container
        env:
          IDENTITY_PRODUCTION_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          IDENTITY_PRODUCTION_BUNDLE_FILE: /tmp/ci-absent-prod-bundle
          IDENTITY_PRODUCTION_TUNNEL_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          IDENTITY_PRODUCTION_TUNNEL_CONFIG_FILE: /tmp/ci-absent-tunnel-config
          IDENTITY_PRODUCTION_TUNNEL_CREDENTIALS_FILE: /tmp/ci-absent-tunnel-credentials
          IDENTITY_PRODUCTION_TUNNEL_ORIGIN_CA_FILE: /tmp/ci-absent-tunnel-origin-ca
        run: |
          set -euo pipefail
          docker compose -f compose.identity.production.yaml -f compose.identity.production-tunnel.yaml \
            --profile production --profile production-tunnel config --format json > "$RUNNER_TEMP/identity-tunnel.json"
          python3 - "$RUNNER_TEMP/identity-tunnel.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          services=d["services"]
          assert set(services)=={"identity-production", "identity-production-tunnel"}
          identity=services["identity-production"]
          tunnel=services["identity-production-tunnel"]
          assert identity["ports"]==[{"mode":"ingress","target":9443,"published":"19443","host_ip":"127.0.0.1","protocol":"tcp"}]
          assert set(identity["networks"])=={"identity-origin","identity-mongo-egress"}
          assert identity["user"]=="65532:65532" and identity["read_only"] is True
          assert "identity-tunnel-egress" not in identity["networks"]
          assert not tunnel.get("ports") and not tunnel.get("network_mode")
          assert tunnel["user"]=="65532:65532" and tunnel["read_only"] is True
          assert tunnel["cap_drop"]==["ALL"] and tunnel.get("privileged",False) is False
          assert "no-new-privileges:true" in tunnel["security_opt"]
          assert tunnel["command"]==["tunnel","--no-autoupdate","--config","/etc/cloudflared/config.yml","run"]
          assert tunnel["image"]=="cloudflare/cloudflared@sha256:"+"b"*64
          assert tunnel["restart"]=="no"
          assert set(tunnel["networks"])=={"identity-origin","identity-tunnel-egress"}
          assert "identity-mongo-egress" not in tunnel["networks"]
          assert len(tunnel["volumes"])==3
          assert all(v["read_only"] is True and v.get("bind",{}).get("create_host_path",False) is False for v in tunnel["volumes"])
          assert {v["target"] for v in tunnel["volumes"]}=={
              "/etc/cloudflared/config.yml", "/run/secrets/identity-tunnel-credentials.json",
              "/run/secrets/identity-tunnel-origin-ca.pem"}
          assert d["networks"]["identity-origin"]["internal"] is True
          assert d["networks"]["identity-mongo-egress"].get("internal",False) is False
          assert d["networks"]["identity-tunnel-egress"].get("internal",False) is False
          print("PRODUCTION_TUNNEL_OFFLINE_COMPOSE_OK no-pull no-up no-DNS")
          PY
          if env -u IDENTITY_PRODUCTION_TUNNEL_DIGEST docker compose \
               -f compose.identity.production.yaml -f compose.identity.production-tunnel.yaml \
               --profile production --profile production-tunnel config --quiet >/dev/null 2>&1; then
            echo 'missing tunnel image digest admitted' >&2; exit 1
          fi
          if env -u IDENTITY_PRODUCTION_TUNNEL_CREDENTIALS_FILE docker compose \
               -f compose.identity.production.yaml -f compose.identity.production-tunnel.yaml \
               --profile production --profile production-tunnel config --quiet >/dev/null 2>&1; then
            echo 'missing private tunnel credentials admitted' >&2; exit 1
          fi
      - name: Real pinned cloudflared parses only exact Identity hostname and deny-all
        run: |
          set -euo pipefail
          # This is the already-pinned cloudflared binary used by ShadowOps
          # staging, NEVER staging's tunnel ID or its credentials.
          image='cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4'
          fixture="$RUNNER_TEMP/identity-production-cloudflared-cli"
          mkdir -p "$fixture"
          python3 - "$fixture/config.yml" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'tests')
          from test_identity_production_tunnel import CONFIG
          Path(sys.argv[1]).write_text(CONFIG)
          PY
          # Public/synthetic CA only. Named-tunnel credential file does not
          # exist and is NEVER mounted. There is no network access.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$fixture/fake-ca.key" -out "$fixture/origin-ca.pem" \
            -subj '/CN=synthetic-no-production-material' >/dev/null 2>&1
          chmod 0644 "$fixture/config.yml" "$fixture/origin-ca.pem"
          docker_args=(--rm --network none --user 65532:65532 --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$fixture/config.yml,dst=/etc/cloudflared/config.yml,readonly" \
            --mount "type=bind,src=$fixture/origin-ca.pem,dst=/run/secrets/identity-tunnel-origin-ca.pem,readonly")
          docker run "${docker_args[@]}" "$image" tunnel --config /etc/cloudflared/config.yml ingress validate
          for case in \
            'https://id.shadowops.dpdns.org/login?app=bridgesquad|#0' \
            'https://id.shadowops.dpdns.org/api/identity/jwks|#0' \
            'https://bridgesquad.shadowops.dpdns.org/|#1' \
            'https://id-staging.shadowops.dpdns.org/|#1' \
            'https://rogue.example.invalid/|#1'; do
            url="${case%|*}"
            expected="${case#*|}"
            route="$(docker run "${docker_args[@]}" "$image" tunnel \
              --config /etc/cloudflared/config.yml ingress rule "$url")"
            if ! grep -Fq "Matched rule $expected" <<< "$route"; then
              echo "Cloudflared ingress did not match expected rule $expected" >&2
              exit 1
            fi
          done
          echo 'REAL_CLOUDFLARED_LOCAL_INGRESS_OK credential=absent network=none deploy=none'
