name: Chronicles production read-only audit
on:
  pull_request:
    paths:
      - '.github/workflows/chronicles-production-audit.yml'
      - 'scripts/chronicles_production_audit.py'
      - 'scripts/chronicles_train_schedule_watch.py'
      - 'tests/test_chronicles_train_schedule_watch.py'
      - 'scripts/chronicles_production_admission.py'
      - 'tests/test_chronicles_production_audit.py'
  # Audit the live production surfaces immediately after audit-code changes
  # land on protected main. PR checks remain offline; this event never deploys.
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronicles-production-audit.yml'
      - 'scripts/chronicles_production_audit.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Chronicles production · release train']
    types: [completed]
    branches: [main]
  schedule:
    # Independent daily fallback at 09:15 Madrid; DST handled by GitHub.
    # Also re-audit on *every* completed train, including failed promotions.
    - cron: '15 9 * * *'
      timezone: Europe/Madrid

permissions:
  contents: read
  actions: read

concurrency:
  group: chronicles-production-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Production external readiness and signed release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests (no network)
        run: python3 -m unittest discover -s tests -p 'test_chronicles_production_audit.py' -v
      - name: Schedule-observation contract tests (no network)
        run: python3 -m unittest discover -s tests -p 'test_chronicles_train_schedule_watch.py' -v
      - name: Public HTTPS, API/CORS and exact-SHA production receipts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CHRONICLES_PAGES_ENV: production
        run: python3 scripts/chronicles_production_audit.py

  schedule_watch:
    name: Verify the 08:00 Madrid release train was actually triggered
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the scheduled train exists, independent of current production health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/chronicles_train_schedule_watch.py
