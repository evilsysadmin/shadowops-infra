name: Bridge Squad · retired bootstrap contracts (offline)
on:
  pull_request:
    paths:
      - '.github/workflows/bridgesquad-pages-bootstrap.yml'
      - 'scripts/bridgesquad_alias_bootstrap.py'
      - 'tests/test_bridgesquad_alias_bootstrap.py'
      - 'tests/test_bridgesquad_pages_bootstrap_workflow.py'
      - 'edge/bridgesquad-identity-gate.mjs'
      - 'docs/bridgesquad-identity.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridgesquad-pages-bootstrap.yml'
      - 'scripts/bridgesquad_alias_bootstrap.py'
      - 'tests/test_bridgesquad_alias_bootstrap.py'
      - 'tests/test_bridgesquad_pages_bootstrap_workflow.py'
      - 'edge/bridgesquad-identity-gate.mjs'
      - 'docs/bridgesquad-identity.md'
permissions:
  contents: read
concurrency:
  group: bridgesquad-first-locked-pages-upload
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact-host, production JWT, anonymous-denial edge contract
        run: node --test tests/bridgesquad-identity-gate.test.mjs
      - name: Verify Cloudflare empty-private contract and aliases
        run: python3 -m unittest discover -s tests -p test_bridgesquad_alias_bootstrap.py -v
      - name: Verify release admission, HTML seal and Worker byte parity
        run: |
          python3 -m unittest discover -s tests -p test_bridgesquad_source_admission.py -v
          python3 -m unittest discover -s tests -p test_bridgesquad_release_package.py -v
      - name: Prove workflow never installs production DNS or secrets
        run: python3 -m unittest discover -s tests -p test_bridgesquad_pages_bootstrap_workflow.py -v
