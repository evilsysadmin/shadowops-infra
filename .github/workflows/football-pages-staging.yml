name: Football · independent staging Pages
on:
  pull_request:
    paths: ['.github/workflows/football-pages-staging.yml', 'scripts/football_*', 'tests/test_football*.py', 'docs/football-staging.md']
  push:
    branches: [main]
    paths: ['.github/workflows/football-pages-staging.yml', 'scripts/football_*', 'tests/test_football*.py', 'docs/football-staging.md']
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
        description: Re-deliver the admitted source even if already published; does not bypass any source/capacity checks
      identity_binding:
        type: choice
        options: [preserve, activate]
        default: preserve
        description: Activate only Football's explicitly provisioned ShadowOps ID proof in the Pages edge
      real_identity_smoke:
        type: boolean
        default: false
        description: Once per activation, exercise native signup/login/logout using one ordinary disposable staging test account
permissions:
  contents: read
  actions: read
concurrency:
  group: shadowops-football-staging-pages
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_football_delivery.py -v
      - run: python3 -m unittest discover -s tests -p test_football_identity.py -v
  candidate:
    needs: contracts
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.admit.outputs.publish }}
      source_sha: ${{ steps.admit.outputs.source_sha }}
      artifact_id: ${{ steps.admit.outputs.artifact_id }}
      artifact_digest: ${{ steps.admit.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          FOOTBALL_FORCE_REDEPLOY: ${{ inputs.force || false }}
        run: python3 scripts/football_delivery.py candidate
  publish:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.football.shadowops.dpdns.org/
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FOOTBALL_R2_API_TOKEN: ${{ secrets.FOOTBALL_R2_API_TOKEN }}
      SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
      ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the immutable artifact ZIP before safe extraction
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh api "repos/evilsysadmin/football-of-matthias/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/football.zip"
          echo "${ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/football.zip" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import os,zipfile,stat
          root=Path('football-release');root.mkdir()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'football.zip') as archive:
              total=0
              for item in archive.infolist():
                  p=PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in item.filename or stat.S_ISLNK(item.external_attr>>16):raise SystemExit('Unsafe source artifact')
                  total+=item.file_size
                  if total>200_000_000:raise SystemExit('Source artifact too large')
              archive.extractall(root)
          PY
          python3 scripts/football_delivery.py validate football-release "$SOURCE_SHA"
      - name: Recheck current source and installed Infra owner before cloud mutation
        run: |
          set -euo pipefail
          test "$(gh api repos/evilsysadmin/football-of-matthias/commits/main --jq .sha)" = "$SOURCE_SHA"
          for path in scripts/football_delivery.py scripts/football_pages.py scripts/football_identity.py .github/workflows/football-pages-staging.yml; do
            test "$(gh api "repos/evilsysadmin/shadowops-infra/contents/$path?ref=main" --jq .sha)" = "$(git rev-parse "HEAD:$path")"
          done
          python3 scripts/football_pages.py preflight
          python3 scripts/football_delivery.py runtime football-release "$SOURCE_SHA"
          python3 scripts/football_pages.py project
          python3 scripts/football_pages.py identity-policy
      - uses: actions/setup-python@v5
        if: inputs.identity_binding == 'activate'
        with:
          python-version: '3.13'
      - name: Install the pinned Identity custody client
        if: inputs.identity_binding == 'activate'
        run: python3 -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Activate only the isolated Football Identity edge proof when requested
        if: inputs.identity_binding == 'activate'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
        run: python3 scripts/football_identity.py
      - name: Deploy the exact tested standalone frontend
        run: |
          set -euo pipefail
          test "$(gh api repos/evilsysadmin/football-of-matthias/commits/main --jq .sha)" = "$SOURCE_SHA"
          npx --yes wrangler@4.127.1 pages deploy football-release/web --project-name football-staging --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=false
          python3 scripts/football_pages.py domain
          python3 scripts/football_delivery.py verify "$SOURCE_SHA"
  browser:
    name: Football · public ShadowOps ID gate
    needs: [contracts, candidate, publish]
    if: always() && needs.contracts.result == 'success' && (github.event_name == 'pull_request' || needs.publish.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
      FOOTBALL_REAL_IDENTITY_SMOKE: ${{ inputs.real_identity_smoke || false }}
      FOOTBALL_SCREENSHOTS: ${{ github.workspace }}/.artifacts/football-public
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/football-browser" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/football-browser/node_modules/.bin/playwright" install chromium
          cp scripts/football_staging_smoke.mjs "$RUNNER_TEMP/football-browser/smoke.mjs"
      - name: Exercise the public frontend and immutable Godot runtime
        run: node "$RUNNER_TEMP/football-browser/smoke.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-public-browser-${{ github.sha }}
          path: .artifacts/football-public
          if-no-files-found: error
          retention-days: 7
