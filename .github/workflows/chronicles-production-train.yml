name: Chronicles production · release train
run-name: Chronicles train · 08:00 Madrid · ${{ inputs.automated && 'external-schedule' || github.event_name }}

on:
  pull_request:
    paths:
      - '.github/workflows/chronicles-production-train.yml'
      - 'scripts/chronicles_production_train.py'
      - 'tests/test_chronicles_production_train.py'
      - 'scripts/chronicles_production_admission.py'
  schedule:
    # Daily at local Madrid wall-clock time; GitHub handles CET/CEST changes.
    - cron: '0 8 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact 40-hex previously validated Chronicles SHA; blank = live staging build
        type: string
        required: false
      dry_run:
        description: Verify staging candidate and production readiness without triggering any deploy
        type: boolean
        required: false
        default: false
      pages_only:
        description: Manual recovery only - keep verified exact-SHA production API, deploy Pages only (requires source_sha)
        type: boolean
        required: false
        default: false
      automated:
        description: External scheduler invocation; use the same automatic production safety preflight as schedule
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Serializes automatic train runs and manual train hotfixes. The child
# workflows retain their own production target locks and admission gates.
concurrency:
  group: shadowops-chronicles-production-train
  cancel-in-progress: false

jobs:
  contracts:
    name: Release train offline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check PyYAML
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_production_train.py' -v

  preflight:
    name: Read-only staging admission and production inspection
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CHRONICLES_PAGES_ENV: production
      CHRONICLES_TRAIN_DRY_RUN: 'true'
      CHRONICLES_TRAIN_SOURCE_SHA: ${{ inputs.source_sha || '' }}
      CHRONICLES_TRAIN_PAGES_ONLY: ${{ inputs.pages_only == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate candidate and current production without writes
        run: python3 scripts/chronicles_production_train.py
      - name: Archive admitted source SHA and planned action
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-production-train-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/chronicles-production-train.json
          if-no-files-found: error
          retention-days: 30

  train:
    name: Admit staging, promote API, promote Pages, verify public release
    needs: contracts
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)) && github.repository == 'evilsysadmin/shadowops-infra' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: production
      url: https://chronicles.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CHRONICLES_PAGES_ENV: production
      CHRONICLES_TRAIN_SOURCE_SHA: ${{ inputs.source_sha || '' }}
      CHRONICLES_TRAIN_PAGES_ONLY: ${{ inputs.pages_only == true }}
      CHRONICLES_TRAIN_AUTOMATED: ${{ github.event_name == 'schedule' || inputs.automated == true }}
      # Must be enabled only as part of the Cloudflare/GitHub cutover.
      CHRONICLES_TRAIN_DEDUPE_ENABLED: ${{ vars.CHRONICLES_TRAIN_DEDUPE_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Promote only admitted source, stop if API/Pages fail
        run: python3 scripts/chronicles_production_train.py
      - name: Archive source SHA and child run IDs even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-production-train-${{ github.run_id }}
          path: ${{ runner.temp }}/chronicles-production-train.json
          if-no-files-found: error
          retention-days: 90
