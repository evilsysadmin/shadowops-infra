name: Release ledger policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/release-ledger.test.mjs
