name: Star Adventures staging rollback inventory (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/staradvs-rollback-inventory.yml'
      - 'scripts/staradvs_rollback_inventory.py'
      - 'tests/test_staradvs_rollback_inventory.py'
      - 'docs/staradvs-staging.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/staradvs-rollback-inventory.yml'
      - 'scripts/staradvs_rollback_inventory.py'
      - 'tests/test_staradvs_rollback_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadowops-staradvs-rollback-inventory
  cancel-in-progress: false

jobs:
  contracts:
    name: Reject unsafe Pages rollback candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/staradvs_rollback_inventory.py
      - run: python3 -m unittest discover -s tests -p 'test_staradvs_rollback_inventory.py' -v

  live:
    name: Inspect dedicated Pages staging rollback options (GET only)
    needs: contracts
    if: >-
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    environment:
      name: staging
      url: https://staging.staradvs.shadowops.dpdns.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only public verified SHA and dedicated Pages deployment inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 scripts/staradvs_rollback_inventory.py
