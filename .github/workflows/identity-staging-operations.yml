name: ShadowOps Identity · isolated staging operational handoff
on:
  pull_request:
    paths:
      - 'compose.identity.staging.yaml'
      - 'compose.identity.staging.atlas-evaluation.yaml'
      - 'compose.identity.atlas.staging.yaml'
      - 'host/*identity-staging*'
      - 'host/identity-atlas-staging-backup.py'
      - 'host/identity-atlas-staging-backup.service'
      - 'host/identity-atlas-staging-backup.timer'
      - 'host/identity-atlas-staging-prepare.py'
      - 'host/identity-atlas-staging-preflight.py'
      - 'scripts/identity_staging_*.py'
      - 'tests/test_identity_staging_*.py'
      - 'tests/test_identity_pawn_action.py'
      - 'tests/test_identity_platform_contract.py'
      - 'config/identity/platform-contract.json'
      - '.github/workflows/identity-staging-operations.yml'
  push:
    branches: [main]
    paths:
      - 'compose.identity.staging.yaml'
      - 'compose.identity.staging.atlas-evaluation.yaml'
      - 'compose.identity.atlas.staging.yaml'
      - 'host/*identity-staging*'
      - 'host/identity-atlas-staging-backup.py'
      - 'host/identity-atlas-staging-backup.service'
      - 'host/identity-atlas-staging-backup.timer'
      - 'host/identity-atlas-staging-prepare.py'
      - 'host/identity-atlas-staging-preflight.py'
      - 'scripts/identity_staging_*.py'
      - 'tests/test_identity_staging_*.py'
      - 'tests/test_identity_pawn_action.py'
      - 'tests/test_identity_platform_contract.py'
      - 'config/identity/platform-contract.json'
      - '.github/workflows/identity-staging-operations.yml'
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [provision, deploy, inspect, backup, atlas-custody, atlas-prepare, atlas-prepare-database-scoped, atlas-preflight, atlas-backup, atlas-roles-plan, atlas-roles-apply, atlas-roles-check]
        required: true
        description: Provision local custody, deploy, inspect, backup, or create separate Atlas custody
      cka_consumer:
        type: choice
        options: [preserve]
        default: preserve
        description: Provision only; CKA online is retired; existing non-CKA consumers are preserved
      football_consumer:
        type: choice
        options: [preserve, enable]
        default: preserve
        description: Provision only — enable the isolated Football staging consumer without changing existing keys
      pawn_action_consumer:
        type: choice
        options: [preserve, enable]
        default: preserve
        description: Provision only — add Pawn Action's own staging audience, preserving all existing credentials
      admin_inventory:
        type: choice
        options: [preserve, enable]
        default: preserve
        description: Provision only — add independent staging inventory custody; does not grant an account admin role
      source_sha:
        type: string
        required: false
        description: Deploy or Atlas preflight — exact protected Infra main SHA with a published Identity image
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check 'oci==2.185.2' 'pymongo==4.16.0' 'dnspython==2.8.0'
      - run: python3 -m unittest discover -s tests -p 'test_identity_staging_*.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_chronicles_identity_activation.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_identity_football.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_identity_pawn_action.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_identity_platform_contract.py' -v
      - run: bash -n host/install-identity-staging.sh && bash -n host/bootstrap-identity-staging-over-ssh.sh
      - run: bash -n host/install-shared-identity-staging.sh
      - run: sudo visudo -cf host/identity-staging.sudoers
      - name: Real isolated image + Mongo TLS persistence journey
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'inspect'
        env:
          IDENTITY_STACK_TEST: '1'
        run: python3 -m unittest discover -s tests -p 'test_identity_staging_stack.py' -v
  atlas-roles-check:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'atlas-roles-check' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      IDENTITY_ATLAS_STAGING_RUNTIME_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_RUNTIME_URI }}
      IDENTITY_ATLAS_STAGING_INVENTORY_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_INVENTORY_URI }}
      IDENTITY_ATLAS_STAGING_BACKUP_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_BACKUP_URI }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2' 'pymongo==4.16.0' 'dnspython==2.8.0'
      - name: Verify Atlas access without writes
        run: python scripts/identity_staging_atlas_roles_check.py
  provision:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'provision' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      IDENTITY_STAGING_CKA: ${{ inputs.cka_consumer || 'preserve' }}
      IDENTITY_STAGING_FOOTBALL: ${{ inputs.football_consumer || 'preserve' }}
      IDENTITY_STAGING_PAWN_ACTION: ${{ inputs.pawn_action_consumer || 'preserve' }}
      IDENTITY_STAGING_ADMIN_INVENTORY: ${{ inputs.admin_inventory || 'preserve' }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Preserve existing keys; provision only Identity staging resources
        run: python scripts/identity_staging_provision.py
  atlas-custody:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'atlas-custody' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      IDENTITY_ATLAS_STAGING_RUNTIME_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_RUNTIME_URI }}
      IDENTITY_ATLAS_STAGING_INVENTORY_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_INVENTORY_URI }}
      IDENTITY_ATLAS_STAGING_BACKUP_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_BACKUP_URI }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Create or verify independent Atlas custody
        run: python scripts/identity_staging_atlas_provision.py
  atlas-prepare:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'atlas-prepare' || inputs.action == 'atlas-prepare-database-scoped') && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      ATLAS_PREPARE_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Prepare separate Atlas configuration only
        run: python scripts/identity_staging_release.py "$ATLAS_PREPARE_ACTION"
  atlas-backup:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'atlas-backup' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Run the fixed encrypted Atlas backup
        run: python scripts/identity_staging_release.py atlas-backup
  atlas-roles:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'atlas-roles-plan' || inputs.action == 'atlas-roles-apply') && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: shadowops-identity-atlas-roles
      cancel-in-progress: false
    env:
      ROLE_ACTION: ${{ inputs.action }}
      IDENTITY_ATLAS_PROJECT_ID: ${{ vars.IDENTITY_ATLAS_PROJECT_ID }}
      ATLAS_API_PUBLIC_KEY: ${{ secrets.IDENTITY_ATLAS_API_PUBLIC_KEY }}
      ATLAS_API_PRIVATE_KEY: ${{ secrets.IDENTITY_ATLAS_API_PRIVATE_KEY }}
      IDENTITY_ATLAS_STAGING_RUNTIME_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_RUNTIME_URI }}
      IDENTITY_ATLAS_STAGING_INVENTORY_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_INVENTORY_URI }}
      IDENTITY_ATLAS_STAGING_BACKUP_URI: ${{ secrets.IDENTITY_ATLAS_STAGING_BACKUP_URI }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Plan or apply only the fixed Identity staging roles
        shell: bash
        run: |
          set -euo pipefail
          case "$ROLE_ACTION" in
            atlas-roles-plan) python3 scripts/identity_staging_atlas_role_manager.py plan ;;
            atlas-roles-apply) python3 scripts/identity_staging_atlas_role_manager.py apply ;;
            *) exit 64 ;;
          esac
  admit:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'deploy' || inputs.action == 'atlas-preflight') && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.admission.outputs.digest }}
      source_sha: ${{ steps.admission.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_SHA: ${{ inputs.source_sha }}
      IMAGE: ghcr.io/evilsysadmin/shadowops-identity
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Admit only protected source and the exact signed arm64 image
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 64
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/${sha}...main" --jq .status)"
          [[ "$status" == identical || "$status" == ahead ]] || exit 65
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
            | python3 -c 'import json,sys;c=json.load(sys.stdin)["check_runs"];required={"Authenticated TLS runtime and least-privilege Mongo gate","Isolated issuer core tests / Go vet / gofmt","MongoDB ephemeral session CAS / revocation integration","Replica-set atomic suspension and session revocation","Publish SHA-pinned Identity staging image"};good={x["name"] for x in c if x["status"]=="completed" and x["conclusion"]=="success" and x["app"]["slug"]=="github-actions"};assert required <= good'
          manifest="$(docker buildx imagetools inspect "${IMAGE}:staging-${sha}" --format '{{json .Manifest}}')"
          digest="$(printf '%s' "$manifest" | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 66
          printf '%s' "$manifest" | python3 -c 'import json,sys;m=json.load(sys.stdin);assert any(x.get("platform",{}).get("os")=="linux" and x.get("platform",{}).get("architecture")=="arm64" for x in m.get("manifests",[]))'
          gh attestation verify "oci://${IMAGE}@${digest}" \
            --owner evilsysadmin \
            --signer-workflow evilsysadmin/shadowops-infra/.github/workflows/identity-service.yml \
            --source-ref refs/heads/main --source-digest "$sha" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
  atlas-preflight:
    needs: admit
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'atlas-preflight' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      ADMITTED_DIGEST: ${{ needs.admit.outputs.digest }}
      ADMITTED_SHA: ${{ needs.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Check Atlas connections from an isolated staging container
        run: python scripts/identity_staging_release.py atlas-preflight
  deploy:
    needs: admit
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      ADMITTED_DIGEST: ${{ needs.admit.outputs.digest }}
      ADMITTED_SHA: ${{ needs.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Invoke only the installed Identity staging wrapper
        run: python scripts/identity_staging_release.py
      - name: Verify public readiness and exact runtime source receipt
        env:
          EXPECTED_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 https://id-staging.shadowops.dpdns.org/readyz >/dev/null
          curl -fsS --max-time 10 https://id-staging.shadowops.dpdns.org/api/identity/release \
            | python3 -c 'import json,os,sys;r=json.load(sys.stdin);assert r=={"service":"shadowops-identity","environment":"staging","source_sha":os.environ["EXPECTED_SHA"]}'
  inspect:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'inspect' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Read only the sanitized previous Identity release receipt
        run: python scripts/identity_staging_release.py inspect
  backup:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'backup' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Run only the fixed staging backup wrapper; never transfer plaintext
        run: python scripts/identity_staging_release.py backup
