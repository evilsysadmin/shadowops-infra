name: ShadowOps Identity · Go core isolation
on:
  pull_request:
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-core.yml'
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-core.yml'

permissions:
  contents: read

jobs:
  core:
    name: Isolated issuer core tests / Go vet / gofmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Reject unformatted Go
        run: |
          set -euo pipefail
          files="$(gofmt -l services/identity/core/*.go services/identity/mongostore/*.go services/identity/password/*.go services/identity/pendingaccounts/*.go services/identity/revocation/*.go services/identity/issuance/*.go services/identity/websession/*.go services/identity/runtime/*.go services/identity/cmd/service-staging/*.go)"
          if [[ -n "$files" ]]; then
            for file in $files; do gofmt -d "$file"; done
            exit 1
          fi
      - name: Download pinned Mongo driver and dependencies
        working-directory: services/identity
        run: go mod download
      - name: Race-tested isolated identity core
        working-directory: services/identity
        run: go test -race -count=1 ./...
      - name: Vet identity core
        working-directory: services/identity
        run: go vet ./...
