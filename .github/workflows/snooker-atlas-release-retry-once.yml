name: Snooker · one-use protected Atlas Identity retry after OCI audit
on:
  pull_request:
    paths:
      - 'ops/snooker-staging/atlas-release-retry-once-2026-11-10.json'
      - '.github/workflows/snooker-atlas-release-retry-once.yml'
      - 'scripts/snooker_atlas_release_retry_request.py'
      - 'tests/test_snooker_atlas_release_retry_request.py'
  push:
    branches: [main]
    paths:
      - 'ops/snooker-staging/atlas-release-retry-once-2026-11-10.json'
permissions:
  contents: read
jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require immutable first-addition request and reject replay
        run: python3 -m unittest discover -s tests -p test_snooker_atlas_release_retry_request.py -v
  dispatch:
    if: >-
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment:
      name: staging
    concurrency:
      group: shadowops-snooker-atlas-release-retry-once
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Admit this one-use request against the exact protected main
        run: python3 scripts/snooker_atlas_release_retry_request.py
      - name: Verify signed published Identity image source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          published="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42611388936" --jq '.head_sha + ":" + .conclusion + ":" + .event')"
          test "$published" = '4a48dff49c4a77703c6f4b164120d3cef8e77e76:success:push'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42611388936/jobs?per_page=100" \
            | python3 -c 'import json,sys;j=json.load(sys.stdin)["jobs"];a=[x for x in j if x["name"]=="Publish SHA-pinned Identity staging image"];assert len(a)==1 and a[0]["conclusion"]=="success";required={"Run docker/build-push-action@v7","Run actions/attest-build-provenance@v4","Record admitted image digest"};assert required<={step["name"] for step in a[0]["steps"] if step["status"]=="completed" and step["conclusion"]=="success"}'
      - name: Require previous real protected Atlas login and quarantine restore
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          admin="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42807029176" --jq '.head_sha + ":" + .conclusion + ":" + .event')"
          test "$admin" = '324c7fd1630fc44dff53a1263b4d816e8f4190a5:success:workflow_dispatch'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42807029176/jobs?per_page=100" \
            | python3 -c 'import json,sys;j=json.load(sys.stdin)["jobs"];good={x["name"] for x in j if x["conclusion"]=="success"};assert {"contracts","admit","atlas-canary"}<=good'
          restored="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42810596084" --jq '.head_sha + ":" + .conclusion + ":" + .event')"
          test "$restored" = '326a24252bdd9c07a5cd66db9bdc934048a39c37:success:workflow_dispatch'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42810596084/jobs?per_page=100" \
            | python3 -c 'import json,sys;j=json.load(sys.stdin)["jobs"];good={x["name"] for x in j if x["conclusion"]=="success"};assert {"contracts","atlas-restore-rehearsal"}<=good;assert not any(x["name"]=="deploy" and x["conclusion"]=="success" for x in j)'
      - name: Require completed OCI command-creation audit and unchanged public release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42821843479" --jq '.head_sha + ":" + .conclusion + ":" + .event')"
          test "$result" = 'b65ea5f0ecf9c67db0aa0b819ab1be5dba628f49:success:push'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42821843479/jobs?per_page=100" \
            | python3 -c 'import json,sys;j=json.load(sys.stdin)["jobs"];good={x["name"] for x in j if x["conclusion"]=="success"};assert {"contracts","oci","public"}<=good'
          # Logs are never echoed or uploaded. The exact finite receipts are
          # required; a green diagnostic job is not sufficient evidence.
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/129849120167/logs" > "$RUNNER_TEMP/atlas-release-command-audit.log"
          grep -Fq 'IDENTITY_ATLAS_COMMAND_AUDIT created=not-observed-since-attempt' "$RUNNER_TEMP/atlas-release-command-audit.log"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/129849120413/logs" > "$RUNNER_TEMP/atlas-release-public-audit.log"
          grep -Fq 'SNOOKER_IDENTITY_PUBLIC_CHECK login=unavailable-or-unrecognized release_sha=34d5aa2f4db3f522336a150266ac21f94d3ce95f' "$RUNNER_TEMP/atlas-release-public-audit.log"
      - name: Dispatch separately protected, signed and rollback-guarded Atlas release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          gh workflow run identity-staging-operations.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field action=atlas-release \
            --field source_sha=4a48dff49c4a77703c6f4b164120d3cef8e77e76 \
            --field expected_atlas_digest=sha256:6534fb861d3201ab9697b6b84d58a157af748b36c8e96482afd7ea8ca5cddb91
          echo 'Atlas release dispatched. Actual child admit and atlas-release jobs must be verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Host operator checks private matching backup/restore, current Atlas mode, exact public SHA and Snooker callback; rollback retains checkpoint on uncertainty.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Snooker Pages or DNS publication authorized by this request.' >> "$GITHUB_STEP_SUMMARY"
