name: Bridge Squad · create empty fail-closed Pages project
on:
  pull_request:
    paths:
      - 'scripts/bridgesquad_pages_provision.py'
      - 'scripts/bridgesquad_pages_readiness.py'
      - 'tests/test_bridgesquad_pages_provision.py'
      - '.github/workflows/bridgesquad-pages-provision.yml'
      - 'docs/bridgesquad-identity.md'
  push:
    branches: [main]
    paths:
      - 'scripts/bridgesquad_pages_provision.py'
      - 'scripts/bridgesquad_pages_readiness.py'
      - 'tests/test_bridgesquad_pages_provision.py'
      - '.github/workflows/bridgesquad-pages-provision.yml'
      - 'docs/bridgesquad-identity.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadowops-bridgesquad-empty-project
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test owner, orphan and fail-closed project provisioning
        run: python3 -m unittest discover -s tests -p test_bridgesquad_pages_provision.py -v
      - name: Prove syntax without Cloudflare access
        run: python3 -m py_compile scripts/bridgesquad_pages_provision.py
  create-private-project:
    name: Claim only empty Bridge Squad Pages project (never publish)
    needs: contracts
    if: >-
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create or revalidate only empty Pages project, both modes fail-closed
        run: python3 scripts/bridgesquad_pages_provision.py project
      - name: Inspect exact project and confirm no domain or DNS was touched
        run: |
          set -euo pipefail
          python3 scripts/bridgesquad_pages_readiness.py inspect
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from bridgesquad_pages_provision import Client
          from bridgesquad_pages_readiness import PROJECT
          c=Client(os.environ)
          project=c.get('/accounts/'+c.account+'/pages/projects/'+PROJECT)
          assert isinstance(project,dict) and project.get('name')==PROJECT
          for mode in ('production','preview'):
              conf=project.get('deployment_configs',{}).get(mode,{})
              assert conf.get('fail_open') is False
              assert 'global_fetch_strictly_public' in conf.get('compatibility_flags',[])
          print('BRIDGESQUAD_PRIVATE_PAGES_VERIFIED project='+PROJECT+
                ' fail_open=false custom_domain=not_assigned deployed=false')
          PY
