name: Bridge Squad · source release admission (read-only)
on:
  pull_request:
    paths:
      - 'scripts/bridgesquad_source_admission.py'
      - 'scripts/bridgesquad_source_snapshot.py'
      - 'tests/test_bridgesquad_source_snapshot.py'
      - 'scripts/bridgesquad_sealed_candidate_dedupe.py'
      - 'tests/test_bridgesquad_source_admission.py'
      - 'tests/test_bridgesquad_sealed_candidate_dedupe.py'
      - 'tests/test_bridgesquad_sealed_worker_fixture.py'
      - 'scripts/bridgesquad_sealed_worker_fixture.mjs'
      - 'scripts/bridgesquad_sealed_worker_browser.py'
      - 'scripts/bridgesquad_release_package.py'
      - 'tests/test_bridgesquad_release_package.py'
      - 'tests/test_bridgesquad_sealed_handoff_workflow.py'
      - '.github/workflows/bridgesquad-source-admission.yml'
      - 'docs/bridgesquad-identity.md'
  push:
    branches: [main]
    paths:
      - 'scripts/bridgesquad_source_admission.py'
      - 'scripts/bridgesquad_sealed_candidate_dedupe.py'
      - 'tests/test_bridgesquad_source_admission.py'
      - 'tests/test_bridgesquad_sealed_candidate_dedupe.py'
      - 'tests/test_bridgesquad_sealed_worker_fixture.py'
      - 'scripts/bridgesquad_sealed_worker_fixture.mjs'
      - 'scripts/bridgesquad_sealed_worker_browser.py'
      - 'scripts/bridgesquad_release_package.py'
      - 'tests/test_bridgesquad_release_package.py'
      - 'tests/test_bridgesquad_sealed_handoff_workflow.py'
      - '.github/workflows/bridgesquad-source-admission.yml'
      - 'docs/bridgesquad-identity.md'
  workflow_dispatch:
  # Daily source-to-Infra reconciliation: no credentials or production deploy.
  # Main pushes still seal immediately after reviewed Infra changes.
  schedule:
    - cron: '19 7 * * *'
concurrency:
  group: bridgesquad-sealed-handoff-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    name: Verify source provenance and reject corrupted artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact green main and private release ZIP
        run: |
          python3 -m unittest discover -s tests -p test_bridgesquad_source_admission.py -v
          python3 -m unittest discover -s tests -p test_bridgesquad_source_snapshot.py -v
          python3 -m py_compile scripts/bridgesquad_source_snapshot.py
      - run: python3 -m py_compile scripts/bridgesquad_source_admission.py
      - name: Verify sealed Pages package contains only trusted Infra Worker
        run: python3 -m unittest discover -s tests -p test_bridgesquad_release_package.py -v
      - run: python3 -m py_compile scripts/bridgesquad_release_package.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove real sealed Worker rejects guest and enforces Ed25519 revocation
        run: |
          set -euo pipefail
          node --check scripts/bridgesquad_sealed_worker_fixture.mjs
          python3 -m py_compile scripts/bridgesquad_sealed_worker_browser.py
          python3 -m unittest discover -s tests -p test_bridgesquad_sealed_worker_fixture.py -v
      - name: Ensure handoff cannot bypass source checks or deploy publicly
        run: python3 -m unittest discover -s tests -p test_bridgesquad_sealed_handoff_workflow.py -v
  candidate:
    name: Check current exact source CI metadata without writes
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect only current successful Bridge Squad main release
        run: python3 scripts/bridgesquad_source_admission.py check-current

  sealed-candidate:
    name: Produce private SHA-pinned Pages candidate (NEVER deploy)
    needs: contracts
    if: >-
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Admit source main, CI, and exact artifact provenance
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import bridgesquad_source_admission as source
          reader=source.GithubReader(os.environ['GH_TOKEN'])
          sha=source.current_sha(reader)
          proof=source.admit(reader, sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for name in ('source_sha','artifact_id','artifact_digest','run_id'):
                  out.write(f'{name}={proof[name]}\n')
          print('BRIDGESQUAD_ADMITTED_SOURCE sha='+sha
                +' artifact_id='+str(proof['artifact_id'])
                +' digest='+proof['artifact_digest'])
          PY
      - name: Avoid duplicate immutable sealed release on unchanged source and Infra SHAs
        id: duplicate
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bridgesquad_sealed_candidate_dedupe.py check "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Rebuild pinned public game commit into a private source ZIP (no cross-repo Actions download)
        id: snapshot
        if: steps.duplicate.outputs.sealed_exists != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/bridgesquad_source_snapshot.py snapshot \
            "$SOURCE_SHA" "$RUNNER_TEMP/bridgesquad-source.zip" >> "$GITHUB_OUTPUT"
          [[ "$(sed -n 's/^snapshot_digest=//p' "$GITHUB_OUTPUT" | tail -n1)" =~ ^sha256:[0-9a-f]{64}$ ]]
      - uses: actions/setup-node@v4
        if: steps.duplicate.outputs.sealed_exists != 'true'
        with:
          node-version: '22'
      - name: Seal the exact HTML with Infra-owned fail-closed Identity Worker
        if: steps.duplicate.outputs.sealed_exists != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARTIFACT_DIGEST: ${{ steps.snapshot.outputs.snapshot_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bridgesquad_release_package.py prepare             "$RUNNER_TEMP/bridgesquad-source.zip" "$ARTIFACT_DIGEST"             "$SOURCE_SHA" "$RUNNER_TEMP/bridgesquad-sealed"
          python3 scripts/bridgesquad_release_package.py verify             "$RUNNER_TEMP/bridgesquad-sealed" "$ARTIFACT_DIGEST" "$SOURCE_SHA"
      - name: Real Chromium against exactly sealed HTML and real signed-Ed25519 Infra Worker
        if: steps.duplicate.outputs.sealed_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright>=1.50,<2'
          python3 -m playwright install --with-deps chromium
          python3 scripts/bridgesquad_sealed_worker_browser.py "$RUNNER_TEMP/bridgesquad-sealed"
          echo 'BRIDGESQUAD_SEALED_CHROMIUM_OK guest-401 signed-login gameplay renewal revocation aliases-404'
      - name: Recheck unchanged game main before publishing private artifact
        if: steps.duplicate.outputs.sealed_exists != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: python3 scripts/bridgesquad_source_admission.py check "$SOURCE_SHA"
      - name: Archive private Infra candidate for later protected delivery
        if: steps.duplicate.outputs.sealed_exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bridgesquad-sealed-${{ steps.source.outputs.source_sha }}-${{ github.sha }}
          path: ${{ runner.temp }}/bridgesquad-sealed/
          retention-days: 14
          if-no-files-found: error
