name: Bridge Squad · deployed alias security watchdog (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/bridgesquad-alias-watchdog.yml'
      - '.github/workflows/bridgesquad-pages-bootstrap.yml'
      - 'scripts/bridgesquad_alias_bootstrap.py'
      - 'scripts/bridgesquad_alias_watchdog.py'
      - 'scripts/bridgesquad_dns_quarantine.py'
      - 'tests/test_bridgesquad_dns_quarantine.py'
      - 'tests/test_bridgesquad_dns_quarantine_workflow.py'
      - 'tests/test_bridgesquad_alias_bootstrap.py'
      - 'tests/test_bridgesquad_alias_watchdog.py'
      - 'tests/test_bridgesquad_alias_watchdog_workflow.py'
      - 'docs/bridgesquad-identity.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridgesquad-alias-watchdog.yml'
      - '.github/workflows/bridgesquad-pages-bootstrap.yml'
      - 'scripts/bridgesquad_alias_bootstrap.py'
      - 'scripts/bridgesquad_alias_watchdog.py'
      - 'scripts/bridgesquad_dns_quarantine.py'
      - 'tests/test_bridgesquad_dns_quarantine.py'
      - 'tests/test_bridgesquad_dns_quarantine_workflow.py'
      - 'tests/test_bridgesquad_alias_bootstrap.py'
      - 'tests/test_bridgesquad_alias_watchdog.py'
      - 'tests/test_bridgesquad_alias_watchdog_workflow.py'
      - 'docs/bridgesquad-identity.md'
  workflow_dispatch:
  schedule:
    - cron: '31 7 * * *'
permissions:
  contents: read
concurrency:
  group: bridgesquad-locked-alias-guest-watchdog
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check sealed source guest-denial contract
        run: python3 -m unittest discover -s tests -p test_bridgesquad_alias_bootstrap.py -v
      - name: Check independent security watchdog including HTML-with-404 leakage
        run: python3 -m unittest discover -s tests -p test_bridgesquad_alias_watchdog.py -v
      - name: Audit that no PR has access to Cloudflare credentials
        run: python3 -m unittest discover -s tests -p test_bridgesquad_alias_watchdog_workflow.py -v
      - name: Confirm quarantine DNS audit cannot serve game anonymously
        run: python3 -m unittest discover -s tests -p test_bridgesquad_dns_quarantine.py -v
      - name: Python syntax
        run: python3 -m py_compile scripts/bridgesquad_alias_bootstrap.py scripts/bridgesquad_alias_watchdog.py scripts/bridgesquad_dns_quarantine.py
  audit:
    name: Prove deployed Pages aliases remain anonymous-denying
    needs: contracts
    if: >-
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment:
      name: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck exact project, policies, source SHA and all aliases live
        run: python3 scripts/bridgesquad_alias_watchdog.py audit
      - name: Log fail-closed audit receipt
        run: |
          echo 'Bridge Squad Pages aliases denied; if DNS is live the canonical HTTPS host shows only the authentication shell.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Any non-404 or unaudited deployment fails the prior job.' >> "$GITHUB_STEP_SUMMARY"
