name: ShadowOps OCI · one-shot Chronicles first-boot capabilities
on:
  pull_request:
    paths:
      - '.github/workflows/oci-chronicles-boot-capabilities.yml'
      - 'scripts/oci_chronicles_boot_capability.py'
      - 'tests/test_oci_chronicles_boot_capability.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci-chronicles-boot-capabilities.yml'
      - 'scripts/oci_chronicles_boot_capability.py'
      - 'tests/test_oci_chronicles_boot_capability.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_oci_chronicles_boot_capability.py' -v
      - run: python3 scripts/oci_chronicles_boot_capability.py self-test

  capabilities:
    name: One-shot nonprivileged A1 boot authority inventory
    needs: contracts
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, 'one-shot Chronicles boot capability probe') || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Check whether isolated Chronicles first boot can use existing host authority
        run: python scripts/oci_chronicles_boot_capability.py run
