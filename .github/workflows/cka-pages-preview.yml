name: CKA Simulator · public static Pages preview
on:
  pull_request:
    paths: ['.github/workflows/cka-pages-preview.yml', 'scripts/cka_pages.py', 'tests/test_cka_pages.py', 'docs/cka-pages-preview.md']
  push:
    branches: [main]
    paths: ['.github/workflows/cka-pages-preview.yml', 'scripts/cka_pages.py', 'tests/test_cka_pages.py', 'docs/cka-pages-preview.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('shadowops-cka-pages-pr-{0}', github.event.pull_request.number) || 'shadowops-cka-pages-preview' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p test_cka_pages.py -v
  publish:
    name: Publish isolated CKA static preview and verify HTTPS
    needs: contracts
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://cka.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: evilsysadmin/cka-exam-simulator
          ref: main
          path: cka-source
          persist-credentials: false
      - name: Resolve immutable source SHA
        id: source
        run: |
          set -euo pipefail
          sha="$(git -C cka-source rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build safe static preview
        working-directory: cka-source/frontend
        env:
          VITE_BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:public
          npm run test:public
          test -s dist-public/_headers
          node -e 'const m=require("./dist-public/release.json");if(m.build!==process.env.VITE_BUILD_SHA||m.mode!=="static-readonly-preview")process.exit(1)'
      - name: Refuse superseded repositories or absent Cloudflare credentials
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(gh api repos/evilsysadmin/cka-exam-simulator/commits/main --jq .sha)" == "$SOURCE_SHA" ]] || exit 1
          [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || exit 1
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "CKA_MISSING_INFRA_CLOUDFLARE_SECRETS" >&2; exit 1; }
      - name: Preflight exact DNS/project ownership
        run: python3 scripts/cka_pages.py preflight
      - name: Ensure independent Pages project
        run: python3 scripts/cka_pages.py project
      - name: Recheck exact SHA before upload
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(gh api repos/evilsysadmin/cka-exam-simulator/commits/main --jq .sha)" == "$SOURCE_SHA" ]] || exit 1
          [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || exit 1
      - name: Publish isolated static Pages site
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 pages deploy cka-source/frontend/dist-public --project-name cka-simulator --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=false
      - name: Associate only the dedicated CKA domain and CNAME
        run: python3 scripts/cka_pages.py domain
      - name: Verify public HTTPS and exact release SHA
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/cka_pages.py verify "$SOURCE_SHA"
      - name: Write verified release receipt
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf '{"application":"cka-exam-simulator","mode":"static-readonly-preview","build":"%s","url":"https://cka.shadowops.dpdns.org"}\n' "$SOURCE_SHA" > "$RUNNER_TEMP/cka-pages-receipt.json"
          echo "CKA_STATIC_PUBLIC_PREVIEW_VERIFIED $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cka-pages-preview-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/cka-pages-receipt.json
          if-no-files-found: error
          retention-days: 30
