name: ShadowOps Identity · staging TLS runtime and image
on:
  pull_request:
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-service.yml'
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    name: Authenticated TLS runtime and least-privilege Mongo gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Read-only dependency and source checks
        working-directory: services/identity
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...
      - name: Start real TLS/SCRAM replica and reject overbroad runtime roles
        run: bash services/identity/runtime/ci.sh
      - name: Build patched native binaries and scan reachable vulnerabilities
        working-directory: services/identity
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" == go1.27.3 ]]
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/identity-$arch" ./cmd/service-staging
          done
          GOBIN="$RUNNER_TEMP/identity-vuln" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/identity-vuln/govulncheck" ./cmd/service-staging
          "$RUNNER_TEMP/identity-vuln/govulncheck" -mode=binary "$RUNNER_TEMP/identity-amd64"
          "$RUNNER_TEMP/identity-vuln/govulncheck" -mode=binary "$RUNNER_TEMP/identity-arm64"
  publish:
    name: Publish SHA-pinned Identity staging image
    needs: runtime
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/evilsysadmin/shadowops-identity
    steps:
      - name: Require current protected main before publication
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_SHA" == "$current" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Superseded Identity source; dispatch this workflow on current main if an image is needed.'
          fi
      - uses: actions/checkout@v5
        if: steps.admission.outputs.publish == 'true'
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        if: steps.admission.outputs.publish == 'true'
      - uses: docker/login-action@v4
        if: steps.admission.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: push
        if: steps.admission.outputs.publish == 'true'
        with:
          context: services/identity
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: IDENTITY_SOURCE_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/evilsysadmin/shadowops-infra
      - uses: actions/attest-build-provenance@v4
        if: steps.admission.outputs.publish == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record admitted image digest
        if: steps.admission.outputs.publish == 'true'
        run: echo "${IMAGE}@${{ steps.push.outputs.digest }} (staging-${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
