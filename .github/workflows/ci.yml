name: Infrastructure contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-compose.mjs

      - name: CKA public Pages/DNS owner contracts
        run: python3 -m unittest discover -s tests -p 'test_cka_pages.py' -v
