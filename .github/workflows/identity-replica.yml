name: ShadowOps Identity · transactional revocation replica set
on:
  pull_request:
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-replica.yml'
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-replica.yml'
permissions:
  contents: read
jobs:
  revocation:
    name: Replica-set atomic suspension and session revocation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Start ephemeral localhost MongoDB replica set
        run: |
          set -euo pipefail
          docker run -d --name identity-replica --network host mongo:7.0 \
            --replSet identity-rs --bind_ip 127.0.0.1 --port 27018
          for i in {1..45}; do
            if docker exec identity-replica mongosh --quiet \
              'mongodb://127.0.0.1:27018/?directConnection=true' \
              --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx '1'; then
              break
            fi
            sleep 1
          done
          docker exec identity-replica mongosh --quiet \
            'mongodb://127.0.0.1:27018/?directConnection=true' \
            --eval 'rs.initiate({_id:"identity-rs", members:[{_id:0, host:"127.0.0.1:27018"}]})'
          for i in {1..45}; do
            if docker exec identity-replica mongosh --quiet \
              'mongodb://127.0.0.1:27018/?directConnection=true' \
              --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx 'true'; then
              exit 0
            fi
            sleep 1
          done
          docker logs identity-replica --tail 50
          exit 1
      - name: Race-test transaction commit, rollback and contention
        working-directory: services/identity
        env:
          IDENTITY_MONGO_REPLICA_TEST_URL: mongodb://127.0.0.1:27018/?replicaSet=identity-rs&directConnection=true
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./revocation
          go test -race -count=1 -v ./roles
          go test -race -count=1 -v ./issuance
          go test -race -count=1 -v ./websession
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/identity-browser-tools" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/identity-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real Chromium central account journey on desktop and mobile
        working-directory: services/identity
        env:
          IDENTITY_MONGO_REPLICA_TEST_URL: mongodb://127.0.0.1:27018/?replicaSet=identity-rs&directConnection=true
          IDENTITY_BROWSER_TEST: '1'
          IDENTITY_BROWSER_ARTIFACTS: ${{ runner.temp }}/identity-browser-artifacts
          NODE_PATH: ${{ runner.temp }}/identity-browser-tools/node_modules
        run: go test -race -count=1 -v ./websession -run '^TestChromiumCentralAccountJourney$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-login-desktop-mobile
          path: ${{ runner.temp }}/identity-browser-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove test replica set
        if: always()
        run: docker rm -f identity-replica || true
