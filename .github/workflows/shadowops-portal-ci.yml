name: ShadowOps Universe portal · isolated CI
on:
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/shadowops-portal-ci.yml'
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/shadowops-portal-ci.yml'
concurrency:
  group: shadowops-portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REQUIRE_BLENDER_ART: '1'
jobs:
  portal:
    runs-on: ubuntu-24.04
    # Cold apt mirrors can spend >10 min fetching Blender and numpy; do not
    # cancel the entire visual gate before any portal checks have started.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Blender for authored vault export
        run: |
          # Azure's default Ubuntu archive occasionally stalls for 20+ min on
          # individual packages. Prefer the canonical Ubuntu mirror on the
          # ephemeral runner; keep the Blender GLB gate fully mandatory.
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends blender python3-numpy
      - name: Install isolated portal dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Source syntax
        run: npm run check
      - name: Catalog and ownership contracts
        run: npm test
      - name: Production static build
        run: npm run build
      - name: Check actual Pages artifact
        run: test -s dist/index.html && test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - name: Export compiled GLB art to browser QA
        uses: actions/upload-artifact@v4
        with:
          name: portal-compiled-art
          path: |
            portal/public/art/
            portal/src/*.generated.mjs
          if-no-files-found: error
          retention-days: 1
  browser-visual-qa:
    name: Visual QA / 3D and fallback screenshots
    needs: portal
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse exact GLB art built by portal job
        uses: actions/download-artifact@v4
        with:
          name: portal-compiled-art
          path: portal
      - name: Verify reused model manifests
        run: test -s src/vaultAsset.generated.mjs && test -s src/galleryFrame.generated.mjs && test -n "$(find public/art -type f -name 'celestial-vault-*.glb' -print -quit)"
      - name: Install isolated portal dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for deterministic browser smoke
        run: |
          # Playwright --with-deps invokes apt on this second runner too.
          # Reuse the stable archive endpoint from the Blender job.
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          npx playwright install --with-deps chromium
      - name: Desktop, mobile, keyboard and WebGL fallback
        run: npm run test:browser
      - name: Always attach visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadowops-portal-visual-evidence
          path: |
            portal/playwright-report/
            portal/test-results/
          if-no-files-found: warn
          retention-days: 14
