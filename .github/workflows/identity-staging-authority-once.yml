name: ShadowOps Identity · one-use staging authority inventory
on:
  pull_request:
    paths:
      - '.github/workflows/identity-staging-authority-once.yml'
      - 'scripts/identity_staging_authority_once.py'
      - 'tests/test_identity_staging_authority_once.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/identity-staging-authority-once.yml'
      - 'scripts/identity_staging_authority_once.py'
      - 'tests/test_identity_staging_authority_once.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_identity_staging_authority_once.py' -v
  inspect:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Observe existing authority; emit four booleans only
        run: python scripts/identity_staging_authority_once.py
