name: Bridge Squad · production Pages inventory (read-only)
on:
  pull_request:
    paths:
      - 'scripts/bridgesquad_pages_readiness.py'
      - 'tests/test_bridgesquad_pages_readiness.py'
      - '.github/workflows/bridgesquad-pages-inventory.yml'
      - 'docs/bridgesquad-identity.md'
  push:
    branches: [main]
    paths:
      - 'scripts/bridgesquad_pages_readiness.py'
      - 'tests/test_bridgesquad_pages_readiness.py'
      - '.github/workflows/bridgesquad-pages-inventory.yml'
      - 'docs/bridgesquad-identity.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test read-only Cloudflare ownership and foreign resource rejection
        run: python3 -m unittest discover -s tests -p test_bridgesquad_pages_readiness.py -v
      - name: Show immutable, no-secret inventory plan
        run: python3 scripts/bridgesquad_pages_readiness.py plan
  inventory:
    needs: contracts
    if: >-
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe only Bridge Squad Pages and DNS, no writes
        run: python3 scripts/bridgesquad_pages_readiness.py inspect
