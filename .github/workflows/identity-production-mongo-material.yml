name: Identity production Mongo cryptographic material verification (offline)
on:
  pull_request:
    paths:
      - Makefile
      - scripts/identity_production_mongo_material.py
      - tests/test_identity_production_mongo_material.py
      - docs/identity-production-mongo-material.md
      - docs/identity-production-mongo-host.md
      - .github/workflows/identity-production-mongo-material.yml
  push:
    branches: [main]
    paths:
      - Makefile
      - scripts/identity_production_mongo_material.py
      - tests/test_identity_production_mongo_material.py
      - docs/identity-production-mongo-material.md
      - docs/identity-production-mongo-host.md
      - .github/workflows/identity-production-mongo-material.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Real ephemeral OpenSSL certs - reject wrong CA, SAN, keypair and replica key
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python3 -m unittest discover -s tests -p test_identity_production_mongo_material.py -v
          python3 -m unittest discover -s tests -p test_identity_production_mongo_host.py -v
          python3 -m py_compile scripts/identity_production_mongo_material.py
          make identity-prod-mongo-material-plan
          make --dry-run identity-prod-mongo-material-verify
          if python3 -I scripts/identity_production_mongo_material.py verify; then
            echo 'ERROR: CI verified real production Mongo secrets' >&2
            exit 1
          fi
