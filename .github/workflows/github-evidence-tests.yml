name: GitHub source evidence tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/github-evidence.test.mjs tests/inspect-main-protection.test.mjs tests/live-staging-admission-workflow.test.mjs
