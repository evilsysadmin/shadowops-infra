name: Chronicles authenticated staging smoke contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Exercise read-only smoke against synthetic local API
        run: python3 -m unittest discover -s scripts -p test_staging_read_smoke.py -v
      - name: Reject unconfigured staging invocation
        run: |
          if python3 scripts/staging_read_smoke.py --run-id fixture-run --expected-map crypt >/dev/null 2>&1; then
            echo "ERROR: smoke accepted absent token-file configuration" >&2
            exit 1
          fi
