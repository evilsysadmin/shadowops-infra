name: Snooker · publish authenticated staging Pages (automatic + manual)
on:
  pull_request:
    paths:
      - '.github/workflows/snooker-pages-release.yml'
      - 'scripts/snooker_staging_publish.py'
      - 'scripts/snooker_release_package.py'
      - 'tests/test_snooker_release_package.py'
      - 'scripts/snooker_staging_operator.py'
      - 'tests/test_snooker_staging_publish.py'
      - 'tests/test_snooker_staging_operator.py'
      - 'tests/snooker-identity-gate.test.mjs'
      - 'edge/snooker-identity-gate.mjs'
      - 'docs/snooker-staging.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snooker-pages-release.yml'
      - 'scripts/snooker_staging_publish.py'
      - 'scripts/snooker_release_package.py'
      - 'tests/test_snooker_release_package.py'
      - 'scripts/snooker_staging_operator.py'
      - 'tests/test_snooker_staging_publish.py'
      - 'tests/test_snooker_staging_operator.py'
      - 'tests/snooker-identity-gate.test.mjs'
      - 'edge/snooker-identity-gate.mjs'
      - 'docs/snooker-staging.md'
  # Poll independently of the game repository, just like Football staging.
  # Each run admits only the exact green game-main SHA and is a no-op when
  # Cloudflare already serves that SHA through the protected domain.
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shadowops-snooker-private-pages-delivery
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p test_snooker_staging_publish.py -v
      - run: python3 -m unittest discover -s tests -p test_snooker_staging_operator.py -v
      - run: python3 scripts/snooker_staging_operator.py
      - run: python3 -m unittest discover -s tests -p test_snooker_release_package.py -v
      - run: node --test tests/snooker-identity-gate.test.mjs
      - run: python3 -m py_compile scripts/snooker_staging_publish.py
  publish:
    needs: contracts
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       github.event_name == 'push') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.snooker.shadowops.dpdns.org/
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: source
        name: Read exact current game main before deciding whether to publish
        shell: bash
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          import snooker_source_admission as src
          sha=src.current_sha(src.GithubReader(os.environ['GH_TOKEN']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('source_sha='+sha+'\n')
          print('SNOOKER_SOURCE_MAIN sha='+sha)
          PY
      - id: decide
        name: Reconcile only existing protected Pages deployment
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # The explicit protected operator path always admits source CI.
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'SNOOKER_STAGING_AUTO_PLAN status=operator-request publish=true'
          else
            # A private, guest-denying, current Pages deployment remains
            # healthy after its source artifact expires. Never require that
            # historical CI ZIP just to prove this read-only no-op.
            python3 scripts/snooker_staging_publish.py auto-plan "$SOURCE_SHA"
          fi
      - name: 'No changes needed: staging already serves exact game main'
        if: steps.decide.outputs.publish == 'false'
        run: |
          echo 'SNOOKER_STAGING_ALREADY_CURRENT guest=denied source=exact'
          echo 'No Pages/DNS/Identity writes or expired CI artifact lookup.' >> "$GITHUB_STEP_SUMMARY"
      - id: admit
        name: Admit exact green source SHA and immutable artifact only for publication
        if: steps.decide.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          import snooker_source_admission as src
          reader=src.GithubReader(os.environ['GH_TOKEN'])
          proof=src.admit(reader,os.environ['SOURCE_SHA'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for key,value in proof.items():out.write(f'{key}={value}\n')
          print('SNOOKER_SOURCE_ACCEPTED sha='+proof['source_sha'])
          PY
      - name: Install pinned OCI SDK
        if: steps.decide.outputs.publish == 'true'
        run: python3 -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Verify active Identity audience and independent Vault custody before cloud writes
        if: steps.decide.outputs.publish == 'true'
        run: python3 scripts/snooker_staging_publish.py identity-ready
      - name: Download exact CI ZIP and make audited private Pages release
        if: steps.decide.outputs.publish == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.source_sha }}
          ARTIFACT_ID: ${{ steps.admit.outputs.artifact_id }}
          DIGEST: ${{ steps.admit.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh api "repos/evilsysadmin/snooker-of-matthias/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/snooker-src.zip"
          echo "${DIGEST#sha256:}  $RUNNER_TEMP/snooker-src.zip" | sha256sum --check
          python3 scripts/snooker_release_package.py prepare "$RUNNER_TEMP/snooker-src.zip" "$DIGEST" "$SOURCE_SHA" "$RUNNER_TEMP/snooker-pages"
      - name: Recheck both main SHAs before touching Cloudflare
        if: steps.decide.outputs.publish == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(gh api repos/evilsysadmin/snooker-of-matthias/commits/main --jq .sha)" = "$SOURCE_SHA"
          test "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" = "$GITHUB_SHA"
      - name: Create or verify private Pages project and fail-closed modes
        if: steps.decide.outputs.publish == 'true'
        run: python3 scripts/snooker_pages_provision.py project
      - name: Bind only isolated Snooker Identity service proof in Pages
        if: steps.decide.outputs.publish == 'true'
        run: python3 scripts/snooker_staging_publish.py bind
      - name: Verify immutable release candidate and source again
        if: steps.decide.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.source_sha }}
          DIGEST: ${{ steps.admit.outputs.artifact_digest }}
        shell: bash
        run: |
          python3 scripts/snooker_release_package.py verify "$RUNNER_TEMP/snooker-pages" "$SOURCE_SHA" "$DIGEST"
          test "$(gh api repos/evilsysadmin/snooker-of-matthias/commits/main --jq .sha)" = "$SOURCE_SHA"
          test "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" = "$GITHUB_SHA"
      - name: Publish only the verified Snooker release via pinned Wrangler
        if: steps.decide.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.source_sha }}
        run: npx --yes wrangler@4.127.1 pages deploy "$RUNNER_TEMP/snooker-pages" --project-name snooker-staging --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=false
      - name: Refuse custom-domain activation unless Pages alias denies anonymous access
        if: steps.decide.outputs.publish == 'true'
        run: python3 scripts/snooker_staging_publish.py domain
      - name: Probe guest denial on custom host and Pages alias
        if: steps.decide.outputs.publish == 'true'
        run: python3 scripts/snooker_staging_publish.py smoke-guest
      - name: Verify live canonical Pages production SHA after upload
        if: steps.decide.outputs.publish == 'true'
        # Cloudflare's upload acknowledgment is not a deployed-release proof.
        # Retry only bounded read-only convergence, then fail closed.
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.source_sha }}
        run: python3 scripts/snooker_staging_publish.py release-verify "$SOURCE_SHA"
      - name: Record source provenance, never service secrets
        if: steps.decide.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ steps.admit.outputs.source_sha }}
          DIGEST: ${{ steps.admit.outputs.artifact_digest }}
        run: |
          echo "Snooker staging: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source CI ZIP: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Guest/alias denied. Authenticated browser journey still requires a human signed-in smoke." >> "$GITHUB_STEP_SUMMARY"

  post_publish_audit:
    name: Snooker · independent post-publish guest and SHA audit
    needs: [contracts, publish]
    # The downstream job cannot race Wrangler on the same push. A failed
    # publisher is also checked to provide a bounded, read-only diagnosis.
    # Keep scheduled 30-minute no-ops cheap; daily audit is independent.
    if: >-
      always() &&
      needs.contracts.result == 'success' &&
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployed host and every alias deny anonymous users
        id: guest
        run: python3 scripts/snooker_staging_publish.py smoke-audit
      - name: Check canonical production SHA matches current green game main
        id: source
        if: ${{ !cancelled() }}
        run: python3 scripts/snooker_staging_publish.py release-audit
      - name: Report independent post-publish acceptance
        if: ${{ always() }}
        env:
          GUEST_RESULT: ${{ steps.guest.outcome }}
          SOURCE_RESULT: ${{ steps.source.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Snooker · post-publish independent read-only audit'
            echo
            echo "| Publisher | $PUBLISH_RESULT |"
            echo "| Anonymous custom domain and Pages aliases denied | $GUEST_RESULT |"
            echo "| Deployed canonical game SHA equals source main | $SOURCE_RESULT |"
            echo
            echo 'A failed or skipped check is not staging acceptance.'
            echo 'Read-only after publish; a human signed-in browser journey remains a separate gate.'
          } >> "$GITHUB_STEP_SUMMARY"
