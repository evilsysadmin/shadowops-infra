name: Pawn Action · deploy locked Pages holding shell (manual only)

on:
  pull_request:
    paths:
      - '.github/workflows/pawn-action-locked-pages-deploy.yml'
      - 'scripts/pawn_action_locked_pages_deploy.py'
      - 'tests/test_pawn_action_locked_pages_deploy.py'
      - 'docs/pawn-action-locked-pages-deploy.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pawn-action-locked-pages-deploy.yml'
      - 'scripts/pawn_action_locked_pages_deploy.py'
      - 'tests/test_pawn_action_locked_pages_deploy.py'
      - 'docs/pawn-action-locked-pages-deploy.md'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Safe offline plan or an operator-authorized deny-all shell deployment'
        required: true
        type: choice
        options: [plan, deploy-locked]
        default: plan
      confirm:
        description: 'For deployment only: type pawn-action-staging:locked'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pawn-action-locked-pages-deploy
  cancel-in-progress: false

jobs:
  contracts:
    name: Pawn Action · locked shell deploy offline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_pawn_action_pages_shell.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_pawn_action_locked_pages_deploy.py' -v
      - run: python3 scripts/pawn_action_locked_pages_deploy.py plan

  deploy-locked:
    name: Pawn Action · manual deploy ONLY the deny-all holding Worker
    needs: contracts
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'evilsysadmin/shadowops-infra' &&
      inputs.operation == 'deploy-locked' &&
      inputs.confirm == 'pawn-action-staging:locked'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAWN_ACTION_PAGES_DEPLOY_TOKEN: ${{ secrets.PAWN_ACTION_PAGES_DEPLOY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify exactly three fail-closed shell files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pawn_action_pages_shell.py build --out "$RUNNER_TEMP/pawn-action-locked-shell"
          python3 scripts/pawn_action_pages_shell.py verify --out "$RUNNER_TEMP/pawn-action-locked-shell"
          test "$(find "$RUNNER_TEMP/pawn-action-locked-shell" -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Recheck Infra main, empty Pages inventory, independent write token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" = "$GITHUB_SHA"
          python3 scripts/pawn_action_locked_pages_deploy.py preflight --shell "$RUNNER_TEMP/pawn-action-locked-shell" --confirm-project pawn-action-staging
      - name: Deploy the verified deny-all Worker; NO game or custom domain
        shell: bash
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PAWN_ACTION_PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" = "$GITHUB_SHA"
          python3 scripts/pawn_action_pages_shell.py verify --out "$RUNNER_TEMP/pawn-action-locked-shell"
          # Recheck empty preview/production inventory immediately before the
          # only Cloudflare write; use the read-only token for this subprocess.
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_READ_TOKEN" python3 scripts/pawn_action_locked_pages_deploy.py preflight --shell "$RUNNER_TEMP/pawn-action-locked-shell" --confirm-project pawn-action-staging
          npx --yes wrangler@4.127.1 pages deploy "$RUNNER_TEMP/pawn-action-locked-shell" --project-name pawn-action-staging --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify live pages.dev alias denies ALL protected paths
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/pawn_action_locked_pages_deploy.py verify-alias
