name: Star Adventures · ShadowOps ID edge contract (candidate)

on:
  pull_request:
    paths:
      - '.github/workflows/staradvs-identity-edge.yml'
      - 'edge/staradvs-identity-gate.mjs'
      - 'tests/staradvs-identity-gate.test.mjs'
      - 'docs/staradvs-identity-edge.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/staradvs-identity-edge.yml'
      - 'edge/staradvs-identity-gate.mjs'
      - 'tests/staradvs-identity-gate.test.mjs'

permissions:
  contents: read

jobs:
  gate:
    name: Exact host, Ed25519, live freshness and revocation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check edge/staradvs-identity-gate.mjs
      - run: node --test tests/staradvs-identity-gate.test.mjs
