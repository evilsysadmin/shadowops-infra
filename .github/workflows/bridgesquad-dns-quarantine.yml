name: Bridge Squad · activate DNS quarantine (auth required, game locked)
on:
  pull_request:
    paths:
      - '.github/workflows/bridgesquad-dns-quarantine.yml'
      - 'scripts/bridgesquad_dns_quarantine.py'
      - 'scripts/bridgesquad_alias_watchdog.py'
      - 'tests/test_bridgesquad_dns_quarantine.py'
      - 'tests/test_bridgesquad_dns_quarantine_workflow.py'
      - '.github/workflows/bridgesquad-alias-watchdog.yml'
      - 'docs/bridgesquad-identity.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridgesquad-dns-quarantine.yml'
      - 'scripts/bridgesquad_dns_quarantine.py'
      - 'scripts/bridgesquad_alias_watchdog.py'
      - 'tests/test_bridgesquad_dns_quarantine.py'
      - 'tests/test_bridgesquad_dns_quarantine_workflow.py'
      - '.github/workflows/bridgesquad-alias-watchdog.yml'
      - 'docs/bridgesquad-identity.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridgesquad-canonical-dns-quarantine
  cancel-in-progress: false
jobs:
  contracts:
    name: Prove exact DNS ownership and negative guest tests (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test reviewed host and JWT denial before any DNS mutation
        run: node --test tests/bridgesquad-identity-gate.test.mjs
      - name: Test exact quarantine DNS ownership and 401-only public shell
        run: python3 -m unittest discover -s tests -p test_bridgesquad_dns_quarantine.py -v
      - name: Regress locked Pages aliases and former watchdog contracts
        run: |
          python3 -m unittest discover -s tests -p test_bridgesquad_alias_bootstrap.py -v
          python3 -m unittest discover -s tests -p test_bridgesquad_alias_watchdog.py -v
          python3 -m unittest discover -s tests -p test_bridgesquad_alias_watchdog_workflow.py -v
      - name: Guard production-only mutation workflow and secret scope
        run: python3 -m unittest discover -s tests -p test_bridgesquad_dns_quarantine_workflow.py -v
      - run: python3 -m py_compile scripts/bridgesquad_dns_quarantine.py scripts/bridgesquad_alias_watchdog.py
  attach:
    name: Claim owned Pages hostname and protected CNAME; verify real HTTPS quarantine
    needs: contracts
    if: >-
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    environment:
      name: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove sealed Worker still denies every Pages alias
        run: python3 scripts/bridgesquad_dns_quarantine.py preflight
      - name: Claim only Bridge Squad Pages domain and its proxied CNAME
        run: python3 scripts/bridgesquad_dns_quarantine.py attach
      - name: Require real DNS, HTTPS login-only shell and inaccessible game assets
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            if python3 scripts/bridgesquad_dns_quarantine.py audit; then
              {
                echo 'BRIDGESQUAD_QUARANTINE_DNS_READY host=bridgesquad.shadowops.dpdns.org https=401-login-shell game=locked'
                echo 'Production ShadowOps ID still unprovisioned; this does NOT mean the game is playable.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo 'BRIDGESQUAD_DNS_HTTPS_NOT_VERIFIED: domain may exist but authenticated-only cutover is incomplete' >&2
          exit 1
