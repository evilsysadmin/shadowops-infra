name: Star Adventures staging operator recovery plan (no mutations)

on:
  pull_request:
    paths:
      - '.github/workflows/staradvs-operator-recovery-plan.yml'
      - 'scripts/staradvs_operator_plan.py'
      - 'tests/test_staradvs_operator_plan.py'
      - 'docs/staradvs-staging.md'
  workflow_dispatch:
    inputs:
      live_sha:
        description: 'Exact 40-character SHA currently published on staging'
        required: true
        type: string
      target_sha:
        description: 'Exact historic 40-character SHA to inspect; never deploy'
        required: true
        type: string
      confirmation:
        description: 'Type PLAN <full-live-sha> TO <full-target-sha> (read-only)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('staradvs-operator-pr-{0}', github.event.pull_request.number) || 'shadowops-staradvs-staging-pages' }}
  cancel-in-progress: false

jobs:
  contract:
    name: Operator plan is read-only (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/staradvs_operator_plan.py
      - run: python3 -m unittest discover -s tests -p 'test_staradvs_operator_plan.py' -v

  operator_plan:
    name: Inspect exact current and historic Pages revisions without mutations
    needs: contract
    if: >-
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    environment:
      name: staging
      url: https://staging.staradvs.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_LIVE_SHA: ${{ inputs.live_sha }}
      TARGET_SHA: ${{ inputs.target_sha }}
      PLAN_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse stale Infra main or missing read-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || exit 1
      - name: Inspect immutable current/historic Pages releases and receipts (GET only)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staradvs_recovery_preflight.py --candidate-sha "$TARGET_SHA" | tee staradvs-operator-evidence.log
      - name: Require exact operator PLAN confirmation and verified staging identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staradvs_operator_plan.py --log staradvs-operator-evidence.log --live-sha "$EXPECTED_LIVE_SHA" --target-sha "$TARGET_SHA" --confirmation "$PLAN_CONFIRMATION"
          [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || exit 1
          echo 'STARADVS_OPERATOR_PLAN_ONLY no POST, no Pages publication, no hold change'
      - name: Preserve read-only operator plan for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staradvs-operator-readonly-${{ github.run_id }}
          path: staradvs-operator-evidence.log
          if-no-files-found: ignore
          retention-days: 7
