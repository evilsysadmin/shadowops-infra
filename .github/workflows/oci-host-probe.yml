name: ShadowOps OCI · existing host probe
on:
  pull_request:
    paths:
      - '.github/workflows/oci-host-probe.yml'
      - 'scripts/oci_host_probe.py'
      - 'scripts/oci_control_plane.py'
      - 'tests/test_oci_host_probe.py'
      - 'tests/test_oci_probe_admission.py'
      - 'host/chronicles-api-deploy.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci-host-probe.yml'
      - 'scripts/oci_host_probe.py'
      - 'scripts/oci_control_plane.py'
      - 'tests/test_oci_host_probe.py'
  workflow_dispatch:
    inputs:
      probe:
        description: Fixed, non-privileged A1 observation (never installs anything)
        type: choice
        options: [host, chronicles-wrapper]
        default: host
        required: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_oci_*.py' -v
      - run: python3 scripts/oci_host_probe.py self-test

  probe:
    name: Nonprivileged host readiness via OCI Run Command
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: shadowops-oci-host-operations
      cancel-in-progress: false
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'oci==2.185.2'
      - name: Probe the pinned existing A1 without sudo or workload changes
        if: inputs.probe != 'chronicles-wrapper'
        run: python scripts/oci_host_probe.py run
      - name: Reject a superseded Infra main before inspecting the Chronicles wrapper
        if: inputs.probe == 'chronicles-wrapper'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)"
          [[ "$current" =~ ^[a-f0-9]{40}$ && "$current" == "$GITHUB_SHA" ]] || {
            echo 'CHRONICLES_WRAPPER_PROBE_SUPERSEDED_MAIN' >&2
            exit 65
          }
      - name: Compare the installed Chronicles API wrapper with protected source
        if: inputs.probe == 'chronicles-wrapper'
        shell: bash
        run: |
          set -euo pipefail
          # Only finite, explicitly authorized states may enter Actions logs
          # or the summary. Raw Oracle stdout remains private in the probe.
          status=0
          verdict="$(python scripts/oci_host_probe.py wrapper)" || status=$?
          case "$verdict" in
            CHRONICLES_API_WRAPPER_CURRENT|CHRONICLES_API_WRAPPER_OUTDATED|CHRONICLES_API_WRAPPER_MISSING|CHRONICLES_API_WRAPPER_UNSAFE) ;;
            *) echo 'CHRONICLES_WRAPPER_PROBE_INVALID_RESULT' >&2; exit 1 ;;
          esac
          printf '### Chronicles API installed wrapper\n\n- Protected Infra SHA: `%s`\n- Host status: `%s`\n- Host mutations: none\n' \
            "$GITHUB_SHA" "$verdict" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$verdict"
          # An OUTDATED/MISSING/UNSAFE observation is NOT a passing check.
          if [[ "$status" != 0 || "$verdict" != CHRONICLES_API_WRAPPER_CURRENT ]]; then
            exit 1
          fi
      - name: Recheck protected main after Chronicles wrapper observation
        if: inputs.probe == 'chronicles-wrapper' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)"
          [[ "$current" =~ ^[a-f0-9]{40}$ && "$current" == "$GITHUB_SHA" ]] || {
            echo 'CHRONICLES_WRAPPER_PROBE_SUPERSEDED_MAIN_AFTER_OBSERVATION' >&2
            printf '\n**Verification invalidated:** protected main advanced during the OCI observation.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 65
          }
