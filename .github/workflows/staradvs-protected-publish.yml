name: Star Adventures · protected ShadowOps ID Pages staging publish (manual only)

on:
  pull_request:
    paths:
      - '.github/workflows/staradvs-protected-publish.yml'
      - 'scripts/staradvs_protected_publish.py'
      - 'tests/test_staradvs_protected_publish.py'
      - 'docs/staradvs-protected-publish.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/staradvs-protected-publish.yml'
      - 'scripts/staradvs_protected_publish.py'
      - 'tests/test_staradvs_protected_publish.py'
  workflow_dispatch:
    inputs:
      operation:
        description: "preflight does GET only; publish writes Pages only after all live policy gates"
        type: choice
        options: [preflight, publish]
        default: preflight
        required: true
      candidate_run_id:
        description: "Successful protected candidate workflow run ID from SAME Infra main SHA"
        type: string
        required: true
      confirm:
        description: "For publish only: STARADVS_PUBLISH_PROTECTED_WORKER"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('staradvs-protected-publish-pr-{0}', github.event.pull_request.number) || 'shadowops-staradvs-staging-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Protected Worker publication and historical-guest guards (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_staradvs_protected_publish.py' -v
      - run: python3 -m py_compile scripts/staradvs_protected_publish.py
      - run: node --test tests/staradvs-identity-gate.test.mjs

  admit:
    name: Exact current Infra candidate artifact and green game source SHA
    needs: contracts
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    outputs:
      game_sha: ${{ steps.admission.outputs.game_sha }}
      artifact: ${{ steps.admission.outputs.artifact }}
      run_id: ${{ steps.admission.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read validated immutable candidate metadata without downloading executable content
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          infra_head="$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)"
          [[ "$GITHUB_SHA" == "$infra_head" ]]
          game_sha="$(gh api repos/evilsysadmin/star-adventures/commits/main --jq .sha)"
          [[ "$game_sha" =~ ^[a-f0-9]{40}$ ]]
          python3 scripts/staradvs_protected_publish.py admit --run-id "$CANDIDATE_RUN_ID" --game-sha "$game_sha" --infra-sha "$GITHUB_SHA"
          echo "game_sha=$game_sha" >> "$GITHUB_OUTPUT"
          echo "artifact=staradvs-protected-candidate-$game_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"

  preflight:
    name: GET-only Access quarantine, active Identity audience and private Pages credential
    needs: [contracts, admit]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Demand operator-provisioned quarantine and Identity without Cloudflare writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_ACCESS_READ_TOKEN"
          python3 scripts/staradvs_protected_publish.py preflight

  publish:
    name: Approved private Pages Worker release (never unpause static publisher)
    needs: [contracts, admit, preflight]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish' &&
      inputs.confirm == 'STARADVS_PUBLISH_PROTECTED_WORKER' &&
      github.repository == 'evilsysadmin/shadowops-infra' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    permissions:
      contents: read
      actions: read
    environment:
      name: staging
      url: https://staging.staradvs.shadowops.dpdns.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck immutable source and reviewed Infra main before uploading
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.admit.outputs.game_sha }}
          CANDIDATE_RUN_ID: ${{ needs.admit.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" ]]
          [[ "$SOURCE_SHA" == "$(gh api repos/evilsysadmin/star-adventures/commits/main --jq .sha)" ]]
          python3 scripts/staradvs_protected_publish.py admit --run-id "$CANDIDATE_RUN_ID" --game-sha "$SOURCE_SHA" --infra-sha "$GITHUB_SHA"
      - name: Download ONLY the admitted candidate produced by verified main
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.admit.outputs.run_id }}
          name: ${{ needs.admit.outputs.artifact }}
          path: protected-dist
          repository: evilsysadmin/shadowops-infra
          github-token: ${{ github.token }}
      - name: Reject tampered package, unreviewed Workers and unexpected routes
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.game_sha }}
        run: |
          set -euo pipefail
          python3 scripts/staradvs_protected_bundle.py verify --sha "$SOURCE_SHA" --dist protected-dist
          test -s protected-dist/_worker.js
      - name: Final GET-only Access + IdP + Pages custody check before mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
          SOURCE_SHA: ${{ needs.admit.outputs.game_sha }}
        run: |
          set -euo pipefail
          python3 scripts/staradvs_protected_bundle.py verify --sha "$SOURCE_SHA" --dist protected-dist
          python3 scripts/staradvs_protected_publish.py preflight
      - name: Publish exact Infra-owned advanced-mode Worker and pinned game to one Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ needs.admit.outputs.game_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staradvs_protected_bundle.py verify --sha "$SOURCE_SHA" --dist protected-dist
          npx --yes wrangler@4.127.1 pages deploy protected-dist --project-name staradvs-staging --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=false
      - name: Fail closed if Access/quarantine/Identity no longer pass after live Pages upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # A protected 302 does NOT authenticate a player. Never report E2E success.
          for attempt in 1 2 3; do
            if python3 scripts/staradvs_protected_publish.py postflight; then
              echo "STARADVS_PROTECTED_PAGES_GUEST_QUARANTINED e2e=pending"
              exit 0
            fi
            sleep 10
          done
          echo "STARADVS_PROTECTED_PAGES_PENDING postflight inconclusive; retain Access quarantine, do not auto-revert to public" >&2
          exit 1
      - name: Record limited receipt, never actual signed-in acceptance
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.game_sha }}
        run: |
          set -euo pipefail
          {
            echo "### Protected Star Adventures Pages staged candidate"
            echo "Source: $SOURCE_SHA"
            echo "Uploaded: reviewed _worker.js + exact SHA bundle."
            echo "Anonymous guest quarantine: observed candidate."
            echo "**Signed-in real browser E2E: NOT PERFORMED.**"
            echo "**Static public publisher stays pending-identity.**"
          } >> "$GITHUB_STEP_SUMMARY"
