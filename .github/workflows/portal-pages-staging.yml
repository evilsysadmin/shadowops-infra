name: ShadowOps Universe · staging Pages release
on:
  pull_request:
    paths:
      - 'scripts/portal_pages.py'
      - 'scripts/portal_release.py'
      - 'tests/test_portal_pages.py'
      - 'tests/test_portal_release.py'
      - '.github/workflows/portal-pages-staging.yml'
      - 'scripts/portal_main_admission.py'
      - 'scripts/portal_ci_artifact.py'
      - 'tests/test_portal_ci_artifact.py'
      - 'tests/test_portal_main_admission.py'
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'scripts/portal_pages.py'
      - 'scripts/portal_release.py'
      - 'tests/test_portal_pages.py'
      - 'tests/test_portal_release.py'
      - '.github/workflows/portal-pages-staging.yml'
      - 'scripts/portal_main_admission.py'
      - 'scripts/portal_ci_artifact.py'
      - 'tests/test_portal_ci_artifact.py'
      - 'tests/test_portal_main_admission.py'
      - 'scripts/portal_root_release.py'
      - '.github/workflows/portal-root-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadowops-universe-staging-pages-reuse2-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  contracts:
    name: Pages staging identity and ownership safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_portal_pages.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_portal_release.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_portal_main_admission.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_portal_ci_artifact.py' -v
      - run: python3 scripts/portal_pages.py self-test
      - run: python3 -m py_compile scripts/portal_pages.py scripts/portal_release.py
  release:
    name: Build and publish isolated Universe staging
    needs: contracts
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    environment:
      name: staging
      url: https://staging.shadowops.dpdns.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      REQUIRE_BLENDER_ART: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admit exact source despite unrelated Infra main changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/portal_main_admission.py
      - name: Use proven CI GLBs only for identical portal source tree
        id: art
        shell: bash
        run: |
          set -euo pipefail
          mode="$(python3 scripts/portal_ci_artifact.py)"
          [[ "$mode" == "ci" || "$mode" == "blender" ]]
          echo "source=$mode" >> "$GITHUB_OUTPUT"
          echo "SHADOWOPS_UNIVERSE_ART_SOURCE=$mode"
      - name: Reuse previously tested content-addressed Blender art
        if: steps.art.outputs.source == 'ci'
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39793813918 -R "$GITHUB_REPOSITORY"             -n portal-compiled-art -D portal
          test -n "$(find portal/public/art -name 'celestial-vault-*.glb' -print -quit)"
          test -s portal/src/vaultAsset.generated.mjs
      - name: Install Blender only when source changed or CI art expired
        if: steps.art.outputs.source == 'blender'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Install isolated portal dependencies
        run: npm install --prefix portal --ignore-scripts --no-audit --no-fund
      - name: Build identical source with preverified GLBs or fresh Blender export
        working-directory: portal
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          if [[ "${{ steps.art.outputs.source }}" == "ci" ]]; then
            node --test tests/*.test.mjs
            npx vite build
          else
            npm test
            npm run build
          fi
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
      - name: Emit exact immutable public build identity and six GLB digests
        run: python3 scripts/portal_release.py portal/dist "$GITHUB_SHA"
      - name: Refuse superseded portal source or absent Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/portal_main_admission.py
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 scripts/portal_pages.py preflight
      - name: Create only dedicated Universe staging Pages project
        run: python3 scripts/portal_pages.py project
      - name: Recheck current Infra main immediately before publish
        run: python3 scripts/portal_main_admission.py
      - name: Publish static build to dedicated staging project
        run: npx --yes wrangler@4.127.1 pages deploy portal/dist --project-name shadowops-universe-staging --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Associate only staging hostname with exact Pages target
        run: python3 scripts/portal_pages.py domain
      - name: Verify TLS, actual HTML, entry JS, release SHA and all six GLB assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if python3 scripts/portal_pages.py verify --sha "$GITHUB_SHA"; then
              echo "SHADOWOPS_UNIVERSE_STAGING_PUBLIC_READY https://staging.shadowops.dpdns.org sha=$GITHUB_SHA"
              exit 0
            fi
            echo "Staging Pages TLS/asset propagation pending ($attempt/18)"
            sleep 12
          done
          echo "Public staging HTTPS and artifact checks failed" >&2
          exit 1
      - name: Preserve exact publicly verified build for future root promotion
        uses: actions/upload-artifact@v4
        with:
          name: shadowops-universe-staging-build-${{ github.sha }}
          path: portal/dist/
          if-no-files-found: error
          retention-days: 45
      - name: Save verified immutable staging receipt
        shell: bash
        run: |
          mkdir -p portal-receipt
          printf '%s\n' "$GITHUB_SHA" > portal-receipt/sha.txt
          printf 'https://staging.shadowops.dpdns.org\n' > portal-receipt/url.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shadowops-universe-staging-verified-${{ github.sha }}
          path: portal-receipt/
          if-no-files-found: error
          retention-days: 45
