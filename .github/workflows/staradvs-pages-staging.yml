name: Star Adventures staging Pages
on:
  pull_request:
    paths: ['.github/workflows/staradvs-pages-staging.yml', 'config/staradvs-staging-hold.json', 'scripts/staradvs_staging_hold.py', 'tests/test_staradvs_staging_hold.py', 'scripts/staradvs_source_admission.py', 'scripts/staradvs_pages.py', 'tests/test_staradvs_pages.py']
  push:
    branches: [main]
    paths: ['.github/workflows/staradvs-pages-staging.yml', '.github/workflows/staradvs-rollback-inventory.yml', 'config/staradvs-staging-hold.json', 'scripts/staradvs_staging_hold.py', 'tests/test_staradvs_staging_hold.py', 'scripts/staradvs_source_admission.py', 'scripts/staradvs_pages.py', 'scripts/staradvs_rollback_evidence.py', 'tests/test_staradvs_pages.py']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadowops-staradvs-staging-pages
  cancel-in-progress: false
jobs:
  contracts:
    name: Verify source admission and Pages isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_staradvs_pages.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_staradvs_source_admission.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_staradvs_staging_hold.py' -v
  candidate:
    name: Admit current source main and check public HTTPS
    needs: contracts
    if: github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/shadowops-infra' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
      publish: ${{ steps.admit.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: hold
        name: Check reviewed staging publication hold before source admission
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/staradvs_staging_hold.py; then
            echo "automatic=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [[ "$code" -eq 10 ]]; then
              echo "automatic=false" >> "$GITHUB_OUTPUT"
              echo "STARADVS_STAGING_HOLD_SKIP no automatic Pages publication"
            else
              echo 'Invalid or expired staging hold; manual review required' >&2
              exit "$code"
            fi
          fi
      - id: admit
        if: steps.hold.outputs.automatic == 'true'
        name: Require current Star Adventures SHA with green source CI
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/evilsysadmin/star-adventures/commits/main --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 64
          # Infra main pushes can also race Star Adventures' Chrome CI. For
          # dispatch or push, join its exact green main result for a bounded
          # period; scheduled checks stay fail-fast. Never relax admission.
          for attempt in $(seq 1 28); do
            if python3 scripts/staradvs_source_admission.py "$sha"; then
              break
            fi
            if [[ ( "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$GITHUB_EVENT_NAME" != "push" ) || "$attempt" -eq 28 ]]; then
              echo "Star Adventures exact-main CI not admitted" >&2
              exit 1
            fi
            # If main advanced, abandon the superseded candidate rather than
            # waiting for (or publishing) a stale source SHA.
            [[ "$(gh api repos/evilsysadmin/star-adventures/commits/main --jq .sha)" == "$sha" ]] || exit 1
            [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || exit 1
            echo "Source CI finalization pending ($attempt/28); retrying"
            sleep 10
          done
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          if python3 scripts/staradvs_pages.py verify --sha "$sha" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "STARADVS_STAGING_ALREADY_LIVE sha=$sha"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    name: Publish exact source to isolated Cloudflare Pages staging
    needs: [contracts, candidate]
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    permissions:
      contents: read
      actions: read
    environment:
      name: staging
      url: https://staging.staradvs.shadowops.dpdns.org
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: evilsysadmin/star-adventures
          ref: ${{ needs.candidate.outputs.source_sha }}
          path: staradvs-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: staradvs-source/frontend/package-lock.json
      - name: Build exact admitted frontend and immutable release.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C staradvs-source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          npm ci --prefix staradvs-source/frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix staradvs-source/frontend
          test -s staradvs-source/frontend/dist/index.html
          test -n "$(find staradvs-source/frontend/dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          python3 scripts/staradvs_pages.py manifest --sha "$SOURCE_SHA" --dist staradvs-source/frontend/dist
      - name: Refuse superseded Infra and game source SHAs
        shell: bash
        run: |
          set -euo pipefail
          infra_head="$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)"
          game_head="$(gh api repos/evilsysadmin/star-adventures/commits/main --jq .sha)"
          if [[ "$infra_head" != "$GITHUB_SHA" || "$game_head" != "$SOURCE_SHA" ]]; then
            echo "::warning title=Staging superseded::A newer Infra or Star Adventures main arrived while building; the old release was NOT published."
            echo "STARADVS_STAGING_SUPERSEDED expected_source=$SOURCE_SHA latest_source=$game_head expected_infra=$GITHUB_SHA latest_infra=$infra_head"
            {
              echo "### Star Adventures staging: superseded before publication"
              echo "Pinned game SHA: \`$SOURCE_SHA\`"
              echo "Latest game SHA: \`$game_head\`"
              echo "No Cloudflare deployment was attempted. Next trusted reconciliation checks the new source main."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 scripts/staradvs_source_admission.py "$SOURCE_SHA"
      - name: Block stale or paused deployment before any Cloudflare mutation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || exit 1
          python3 scripts/staradvs_staging_hold.py
      - name: Fail closed on missing secrets or foreign Cloudflare DNS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 scripts/staradvs_pages.py preflight
      - name: Establish only isolated Star Adventures Pages project
        run: python3 scripts/staradvs_pages.py project
      - name: Publish exact built frontend to staging
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || exit 1
          python3 scripts/staradvs_staging_hold.py
          [[ "$(gh api repos/evilsysadmin/star-adventures/commits/main --jq .sha)" == "$SOURCE_SHA" ]] || exit 1
          npx --yes wrangler@4.127.1 pages deploy staradvs-source/frontend/dist --project-name staradvs-staging --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=false
      - name: Associate only owned custom-domain and DNS
        run: python3 scripts/staradvs_pages.py domain
      - name: Verify actual TLS, game HTML/JS and SHA on staging FQDN
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if python3 scripts/staradvs_pages.py verify --sha "$SOURCE_SHA"; then
              echo "STARADVS_STAGING_PUBLIC_VERIFIED sha=$SOURCE_SHA"
              exit 0
            fi
            echo "Star Adventures HTTPS pending ($attempt/20)"
            sleep 12
          done
          echo 'Public FQDN unverified: no live receipt' >&2
          exit 1
      - name: Refuse superseded release receipt after public verification
        shell: bash
        run: |
          set -euo pipefail
          # A newer main during the Cloudflare mutation must never receive
          # a success receipt for an obsolete deploy. Next reconciliation heals it.
          [[ "$(gh api repos/evilsysadmin/star-adventures/commits/main --jq .sha)" == "$SOURCE_SHA" ]] || {
            echo 'Source main advanced during staging publication; withhold receipt' >&2
            exit 1
          }
          [[ "$(gh api repos/evilsysadmin/shadowops-infra/commits/main --jq .sha)" == "$GITHUB_SHA" ]] || {
            echo 'Infra main advanced during staging publication; withhold receipt' >&2
            exit 1
          }
      - name: Record exact successful public source SHA
        run: |
          mkdir -p verified-staradvs
          printf '%s\n' "$SOURCE_SHA" > verified-staradvs/source-sha.txt
          printf 'https://staging.staradvs.shadowops.dpdns.org\n' > verified-staradvs/url.txt
      - uses: actions/upload-artifact@v4
        with:
          name: staradvs-staging-verified-${{ needs.candidate.outputs.source_sha }}
          path: verified-staradvs/
          if-no-files-found: error
          retention-days: 30
      - name: Confirm verified staging receipt
        run: echo "STARADVS_STAGING_PUBLIC_READY https://staging.staradvs.shadowops.dpdns.org sha=$SOURCE_SHA"
