name: Verify published Chronicles GHCR provenance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
  checks: read
jobs:
  verify-known-image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 3322ca30f0009f7f371940bf689429e45968e187
      EXPECTED_DIGEST: sha256:09d91f4a45e1c3b69098526aea5fdff1fe74daf0537ffd22badc5217fbb58634
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify published multiarch manifest includes OCI A1 ARM64
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw \
            "ghcr.io/evilsysadmin/chronicles-api@$EXPECTED_DIGEST" \
            > "$RUNNER_TEMP/chronicles-a1-manifest.json"
          jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1' "$RUNNER_TEMP/chronicles-a1-manifest.json"
          jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1' "$RUNNER_TEMP/chronicles-a1-manifest.json"
      - name: Verify exact known published image and signer
        run: |
          node --input-type=module <<'NODE'
          import { verifyImage } from './scripts/verify-image-attestation.mjs';
          const result=verifyImage({sha:process.env.EXPECTED_SHA,digest:process.env.EXPECTED_DIGEST});
          if(!result.verified) throw new Error('source attestation unverified');
          console.log('Verified historical GHCR image with signed source and workflow identity');
          NODE
      - name: Verify fixed source CI jobs against real GitHub check runs
        env:
          PUBLISHED_RUN_ID: 38812775390
        run: |
          node --input-type=module <<'NODE'
          import { verifyRequiredChecks } from './policy/required-checks.mjs';
          const result = await verifyRequiredChecks({
            sha: process.env.EXPECTED_SHA,
            token: process.env.GH_TOKEN,
            sourceRunId: Number(process.env.PUBLISHED_RUN_ID)
          });
          console.log('Verified '+ result.requiredContexts.length +' trusted source jobs');
          NODE

      - name: Exercise full release admission against real protected main
        env:
          VERIFIED_RUN_ID: 38812775390
        run: |
          set -euo pipefail
          node scripts/check-staging-candidate.mjs \
            --sha "$EXPECTED_SHA" \
            --digest "$EXPECTED_DIGEST" \
            --run-id "$VERIFIED_RUN_ID"
