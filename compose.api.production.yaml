# Chronicles of Matthias API (PRODUCTION) and its own Cloudflare Tunnel connector.
# Independent Compose project on the shared A1: never stacked with any other
# file. Secrets come only from the root-owned env files the host wrapper writes
# from OCI Vault (/etc/shadowops/chronicles-api-production/*.env, mode 0600).
name: shadowops-chronicles-production
services:
  chronicles-api:
    image: ghcr.io/evilsysadmin/chronicles-api@${CHRONICLES_API_IMAGE_DIGEST:?Set an admitted sha256 API manifest digest}
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    env_file:
      - /etc/shadowops/chronicles-api-production/api.env
    ports:
      - "127.0.0.1:18091:8080"
    networks:
      - chronicles
    healthcheck:
      test: ["CMD", "/app/chronicles-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  chronicles-tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    platform: linux/arm64
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    env_file:
      - /etc/shadowops/chronicles-api-production/tunnel.env
    networks:
      - chronicles
    depends_on:
      chronicles-api:
        condition: service_healthy

networks:
  chronicles:
    name: shadowops-chronicles-production
