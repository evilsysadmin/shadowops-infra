name: shadowops-cka-account-staging
services:
  cka-account:
    image: ghcr.io/evilsysadmin/cka-account-staging@${CKA_ACCOUNT_IMAGE_DIGEST:?Require admitted immutable CKA account image}
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - /etc/shadowops/cka-account-staging/account.json:/run/secrets/cka-account-staging.json:ro
    networks: [origin, identity-origin]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=65532,gid=65532"]
  cka-account-tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    platform: linux/arm64
    user: "65532:65532"
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20242", "run"]
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    env_file: [/etc/shadowops/cka-account-staging/tunnel.env]
    networks: [origin, tunnel-egress]
    depends_on:
      cka-account:
        condition: service_healthy
networks:
  origin:
    name: shadowops-cka-account-staging-origin
    internal: true
  identity-origin:
    name: shadowops-identity-staging-origin
    external: true
  tunnel-egress:
    name: shadowops-cka-account-staging-tunnel-egress
