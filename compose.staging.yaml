# Explicit staging-only opt-in. Never include this file in production.
# A1 is shared with Chess Studio. The baseline Chronicles project must NOT
# coexist with this staging overlay because both use loopback port 18081.
name: shadowops-chronicles-staging
# Requires Chronicles Go API >= PR #45 (authenticated read-only runs).
services:
  chronicles-api:
    # OCI Ampere A1: refuse to start an amd64-only image in staging.
    platform: linux/arm64
    environment:
      CHRONICLES_ENVIRONMENT: staging
      CHRONICLES_ENABLE_READ_API: "true"
      CHRONICLES_JWT_SECRET_FILE: /run/secrets/chronicles_staging_jwt
    secrets:
      - chronicles_staging_jwt

secrets:
  chronicles_staging_jwt:
    file: ${CHRONICLES_STAGING_JWT_SECRET_FILE:?Set a staging-only JWT signing key file}
